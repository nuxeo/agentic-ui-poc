server {
    listen 80;
    server_name _;

    # Proxy blob downloads from ARender → Nuxeo.
    # ARender containers reach this at http://nuxeo-auth-proxy/nuxeo/nxfile/…
    # NUXEO_AUTH_HEADER is substituted at container startup via envsubst (see docker-compose).
    location /nuxeo/ {
        proxy_pass http://host.docker.internal:8080/nuxeo/;
        proxy_set_header Authorization "Basic ${NUXEO_BASIC_AUTH}";
        proxy_set_header Host host.docker.internal:8080;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
