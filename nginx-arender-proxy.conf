server {
    listen 80;
    server_name _;

    # Proxy blob downloads from ARender → Nuxeo, injecting Basic Auth.
    # ARender containers reach this at http://nuxeo-auth-proxy/nuxeo/nxfile/…
    location /nuxeo/ {
        proxy_pass http://host.docker.internal:8180/nuxeo/;
        proxy_set_header Authorization "Basic QWRtaW5pc3RyYXRvcjpBZG1pbmlzdHJhdG9y";
        proxy_set_header Host host.docker.internal:8180;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
