# ---------------------------------------------------------------------------
# Hyland Content Intelligence Connector (CIC) — Knowledge Discovery + Agents
# ---------------------------------------------------------------------------
# Real property names come from the installed bundle:
#   nuxeo-labs-content-intelligence-connector-core-<version>.jar
#     - OSGI-INF/service-discovery-contrib.xml
#     - OSGI-INF/service-agents-contrib.xml
#
# Copy this file to 50-hyland-cic.conf (gitignored) and fill in the real
# values from the Confluence page:
#   https://hyland.atlassian.net/wiki/spaces/HxAI/pages/1329661828
#
# Then:   docker cp nuxeo-conf/50-hyland-cic.conf nuxeo:/etc/nuxeo/conf.d/
#         docker restart nuxeo
# ---------------------------------------------------------------------------

# ---- Shared HX IDP (token endpoint base) ----------------------------------
# The connector appends "/connect/token" internally, so give it the IDP root.
nuxeo.hyland.cic.auth.baseUrl=https://auth.iam.<env>.experience.hyland.com/idp

# ---- Knowledge Discovery service ------------------------------------------
# Use the **Discovery API** host, NOT the Insight UI host. On Dev this is
# `https://discovery.<env>.experience.hyland.com` (e.g. `discovery.dev...`).
# The Insight UI host (`<env-key>.insight.<env>.ncp.hyland.com`) serves HTML
# and will fail with 401/empty bodies from automation calls.
nuxeo.hyland.cic.discovery.baseUrl=https://discovery.<env>.experience.hyland.com
nuxeo.hyland.cic.discovery.clientId=<service-account-client-id>
nuxeo.hyland.cic.discovery.clientSecret=<service-account-client-secret>
nuxeo.hyland.cic.discovery.environment=<env-key>

# REQUIRED for service accounts issued by Hyland Experience Admin Portal
# (the new `sc-*` / `hyx_cs_*` format). The connector's baked-in default
# `hxp hxp.integrations environment_authorization iam.jti-capture`
# is rejected with `invalid_scope` by the current Dev IDP for these users.
# Minimal scopes confirmed to work for Discovery on Dev:
nuxeo.hyland.cic.discovery.auth.scope=hxp iam.jti-capture

# Optional — grantType defaults to client_credentials.
#nuxeo.hyland.cic.discovery.auth.grantType=client_credentials

# ---- Hyland Agents service (separate service, same IDP) -------------------
# Leave unset if you are not using HylandAgents.* operations.
#nuxeo.hyland.cic.agents.baseUrl=
#nuxeo.hyland.cic.agents.clientId=
#nuxeo.hyland.cic.agents.clientSecret=
#nuxeo.hyland.cic.agents.auth.grantType=client_credentials
#nuxeo.hyland.cic.agents.auth.scope=hxp hxp.integrations environment_authorization

# ===========================================================================
# Hyland HxAI Connector (`nuxeo-hxai-connector`) — pushes Nuxeo documents
# to the HxAI Ingestion service so they become discoverable by Knowledge
# Discovery agents. This is a DIFFERENT plugin from the CIC labs connector
# above and uses a DIFFERENT property namespace (`hxai.*`, not
# `nuxeo.hyland.cic.*`). Both coexist; the CIC connector queries KD, this
# one populates the indexes KD queries.
#
# Install the plugin (one-time):
#   docker exec nuxeo /opt/nuxeo/server/bin/nuxeoctl mp-add nuxeo-hxai-connector-2025.1.0
#   echo "install nuxeo-hxai-connector-2025.1.0" \
#     | docker exec -i nuxeo tee /var/lib/nuxeo/installAfterRestart.log
#   docker restart nuxeo
#
# For reproducible image builds, add `nuxeo-hxai-connector` to the
# `NUXEO_PACKAGES` env var of the Nuxeo container.
# ===========================================================================

# ---- Ingest service (pushes doc binaries + metadata to Content Lake) ------
# Defaults in the bundle point at PROD; for Dev/Staging you MUST override.
#
# IMPORTANT: the authoritative Confluence page
# (https://hyland.atlassian.net/wiki/spaces/HxAI/pages/1329661828) lists the
# Dev ingestion host as `https://ingestion-api.insight.dev.ncp.hyland.com`,
# but that hostname does NOT currently resolve in public DNS (NXDOMAIN from
# 8.8.8.8 and inside the Nuxeo container). Until it becomes reachable, pin
# the connector to the host that actually responds:
#   - Dev:     https://ingestion.insight.dev.experience.hyland.com  <-- use this
#              (Confluence says `ingestion-api...ncp.hyland.com`; not DNS-resolvable yet)
#   - Staging: https://ingestion.insight.staging.experience.hyland.com
#   - Prod:    https://ingestion.insight.<prod>.experience.hyland.com
# The connector appends `/v1/presigned-urls` and `/v1/ingestion-events`.
hxai.ingest.base.url=https://ingestion.insight.dev.experience.hyland.com
hxai.ingest.client.id=<ingest-service-account-client-id>
hxai.ingest.client.secret=<ingest-service-account-client-secret>
# Same tenant environment key as the Discovery config above.
hxai.ingest.env.key=<env-key>

# ---- Nucleus / HxAI auth — override REQUIRED for non-prod environments ---
# The hxai-connector reads these via Nuxeo's ConfigurationService, and the
# defaults compiled into the bundle point at PROD. nuxeo.conf entries alone
# are NOT picked up at runtime by the connector — you must contribute them
# through a ConfigurationService XML extension on the classpath, e.g.:
#
#   /opt/nuxeo/server/nxserver/config/hxai-dev-config.xml
#   <component name="org.nuxeo.hxai.dev.override" version="1.0.0">
#     <require>org.nuxeo.hxai.configuration</require>
#     <extension target="org.nuxeo.runtime.ConfigurationService" point="configuration">
#       <property name="hxai.nucleus.auth.base.url">https://auth.iam.dev.experience.hyland.com</property>
#       <property name="hxai.nucleus.system.integration.base.url">https://api.nucleus.dev.experience.hyland.com</property>
#       <property name="hxai.ingest.base.url">https://ingestion.insight.dev.experience.hyland.com</property>
#     </extension>
#   </component>
#
# Forgetting this causes token calls to hit PROD IDP → `{"error":"invalid_client"}`
# which the connector surfaces as
#   `Error occurred while trying to authenticate to HxAi, grant type: client_credentials scope: hxp`.
#hxai.nucleus.auth.base.url=https://auth.iam.<env>.experience.hyland.com
#hxai.nucleus.system.integration.base.url=https://api.nucleus.<env>.experience.hyland.com
#hxai.nucleus.client.id=<nucleus-service-account-client-id>
#hxai.nucleus.client.secret=<nucleus-service-account-client-secret>
#hxai.nucleus.system.id=<nucleus-system-id>

# ---- Two SEPARATE credential stacks are needed for ingestion -------------
# The `nuxeo-hxai-connector` plugin actually talks to TWO different auth
# surfaces, and a single service account usually cannot cover both:
#
#   1. `hxai.ingest.*` → direct Ingest API calls (`/v1/presigned-urls`,
#      `/v1/ingestion-events`). Once the tenant admin grants the ingest
#      authorization User Group to the Discovery `sc-*` account, a direct
#      `client_credentials` token with scope `hxp iam.jti-capture` is
#      accepted at `/v1/presigned-urls` (verified 200 with a real S3
#      presigned URL). So `hxai.ingest.client.id/secret` CAN reuse the
#      Discovery service account.
#
#   2. `hxai.nucleus.*` → the plugin's own token supplier, inspected from
#      `nuxeo-hxai-connector-core-2025.1.jar` (`AuthClient.class`,
#      `HxAiImpl.class`): it requests
#        scope=system-integrations-config environment_authorization
#      against `hxai.nucleus.auth.base.url`. The Discovery `sc-*` account
#      is rejected with `{"error":"invalid_scope"}` for that scope pair;
#      only a **Nucleus system integration** (different object, registered
#      through the Nucleus system-integration API, with its own
#      client_id/secret and an `hxai.nucleus.system.id` UUID) can mint
#      that token. Until the Hyland platform team registers a Nucleus
#      integration for the tenant, the hxai-connector plugin will keep
#      failing with `Couldn't fetch presigned URLs. HTTP status code: 401`
#      — NOT because the ingest URL or Discovery creds are wrong, but
#      because the plugin authenticates through a separate Nucleus flow.
#
# Request template for Hyland:
#
#   For tenant `<env-key>` on Dev:
#   1. (DONE on 2026-04-24 for sc-4f16...) Add the Discovery service
#      account to the ingest User Group so `hxai.ingest.client.id/secret`
#      can reuse it. Verified with a direct `POST /v1/presigned-urls`
#      call returning 200.
#   2. (OUTSTANDING) Register a **Nucleus system integration** for the
#      same tenant and provide the client_id, client_secret, and
#      `system_id` so the `nuxeo-hxai-connector` plugin can mint its
#      `system-integrations-config environment_authorization` token.
#      Without these, the plugin's own ingest pipeline cannot acquire a
#      token and every `documentModified` listener invocation 401s.
#
# Please also confirm whether `ingestion-api.insight.dev.ncp.hyland.com`
# (documented in Confluence page 1329661828) is expected to become public;
# it is currently NXDOMAIN from the Nuxeo container and dev hosts.
