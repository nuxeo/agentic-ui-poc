# ---------------------------------------------------------------------------
# Hyland CIC — Satori UI *beta* Nuxeo Cloud (Agentic UI smoke target)
# ---------------------------------------------------------------------------
# UI: https://satori-ui.beta.nuxeocloud.com/nuxeo/agentic-ui/#/dashboard
#
# Install marketplace package on the Nuxeo server (if not already present):
#   nuxeo-labs-content-intelligence-connector
#
# Copy to a gitignored file (e.g. 50-hyland-cic.satori-ui-beta.conf) on the
# server under /etc/nuxeo/conf.d/, fill clientId/clientSecret from your
# platform contact, confirm contextEnrichment.baseUrl, then restart Nuxeo.
# ---------------------------------------------------------------------------

# Shared HX IDP — connector appends /connect/token
nuxeo.hyland.cic.auth.baseUrl=https://auth.iam.dev.experience.hyland.com/idp

# Knowledge Discovery
nuxeo.hyland.cic.discovery.baseUrl=https://discovery.dev.experience.hyland.com
nuxeo.hyland.cic.discovery.clientId=<service-account-client-id>
nuxeo.hyland.cic.discovery.clientSecret=<service-account-client-secret>
nuxeo.hyland.cic.discovery.environment=hxai-04798615-6f77-4bc9-b740-8781d1fbf709
nuxeo.hyland.cic.discovery.auth.scope=hxp iam.jti-capture

# Knowledge Enrichment (Context API) — confirm the base host for this tenant
# before go-live; must end with: /latest/api/context-enrichment
nuxeo.hyland.cic.contextEnrichment.baseUrl=https://<confirm-dev-or-test-context-api-host>/latest/api/context-enrichment
nuxeo.hyland.cic.enrichment.clientId=<same-as-discovery-or-dedicated-enrichment-client-id>
nuxeo.hyland.cic.enrichment.clientSecret=<same-as-discovery-or-dedicated-enrichment-secret>
nuxeo.hyland.cic.enrichment.auth.scope=environment_authorization
