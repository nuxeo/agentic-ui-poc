## Agentic UI base URL for permission notification email links.
##
## When unset, emails use {nuxeo.url}/agentic-ui/#/doc/{uid} (production / same-origin).
## For local dev with `nx serve nuxeo-ui` on :4200, set:
##   nuxeo.agentic.ui.url=http://localhost:4200
##
## Requires nuxeo-agentic-core.jar (notification URL codec) in nxserver/bundles.
## Copy to 45-agentic-ui-url.conf (gitignored) and apply both steps below, then restart Nuxeo.
##
##   cp nuxeo-conf/45-agentic-ui-url.sample.conf nuxeo-conf/45-agentic-ui-url.conf
##   docker cp nuxeo-conf/45-agentic-ui-url.conf nuxeo:/etc/nuxeo/conf.d/45-agentic-ui-url.conf
##   docker cp nuxeo-conf/notification-config-agentic.template.xml \
##     nuxeo:/opt/nuxeo/server/templates/common/config/notification-config.xml
##   docker restart nuxeo

nuxeo.agentic.ui.url=http://localhost:4200
