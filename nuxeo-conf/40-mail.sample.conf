## Local outbound mail (SMTP) for User.Invite, notifications, and workflow emails.
## Requires the Mailpit container from ../mailpit-docker-compose.yml on network `nuxeo-net`.
##
## Copy to 40-mail.conf (gitignored), connect Nuxeo to nuxeo-net, then restart Nuxeo:
##   docker network connect nuxeo-net nuxeo
##   docker cp nuxeo-conf/40-mail.conf nuxeo:/etc/nuxeo/conf.d/40-mail.conf
##   docker restart nuxeo
##
## View captured messages: http://localhost:8025

mail.transport.protocol=smtp
mail.transport.host=mailpit
mail.transport.port=1025
mail.transport.auth=false
mail.transport.usetls=false
mail.from=nuxeo-local@localhost
mail.user=Administrator
nuxeo.notification.eMailSubjectPrefix=[Nuxeo-Local]
mail.debug=true
