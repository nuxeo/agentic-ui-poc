<div class="browser-container">
  <div class="breadcrumbs">
    <ng-container *ngFor="let crumb of breadcrumbs(); let last = last">
      <a *ngIf="!last" (click)="navigateTo(crumb.path)" class="crumb-link">{{ crumb.label }}</a>
      <span *ngIf="last" class="crumb-current">{{ crumb.label }}</span>
      <mat-icon *ngIf="!last" class="crumb-separator">chevron_right</mat-icon>
    </ng-container>
  </div>

  <div *ngIf="loading()" class="loading-overlay">
    <mat-spinner diameter="48"></mat-spinner>
  </div>

  <div *ngIf="error()" class="error-message">
    <mat-icon>error</mat-icon>
    {{ error() }}
  </div>

  <table mat-table [dataSource]="documents()" *ngIf="!loading() && !error()" class="documents-table mat-elevation-z2">
    <ng-container matColumnDef="icon">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let doc">
        <mat-icon [class]="'doc-icon type-' + doc.type.toLowerCase()">{{ getIcon(doc) }}</mat-icon>
      </td>
    </ng-container>
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let doc">
        <a (click)="openDocument(doc)" class="doc-link">{{ doc.title }}</a>
      </td>
    </ng-container>
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let doc">
        <mat-chip-set>
          <mat-chip>{{ doc.type }}</mat-chip>
        </mat-chip-set>
      </td>
    </ng-container>
    <ng-container matColumnDef="lastModified">
      <th mat-header-cell *matHeaderCellDef>Last Modified</th>
      <td mat-cell *matCellDef="let doc">{{ doc.lastModified | date:'medium' }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let doc">
        <button mat-icon-button (click)="openDocument(doc)" matTooltip="Open">
          <mat-icon>open_in_new</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="doc-row"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell no-data" colspan="5">
        <mat-icon>folder_open</mat-icon>
        <span>This folder is empty</span>
      </td>
    </tr>
  </table>
</div>
