<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>
        <img src="assets/nuxeo-logo.svg" alt="Nuxeo" class="logo" onerror="this.style.display='none'">
        <span>Nuxeo</span>
      </mat-card-title>
      <mat-card-subtitle>Sign in to your account</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" autocomplete="username" />
          @if (form.get('username')?.hasError('required')) {
            <mat-error>Username is required</mat-error>
          }
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="password" autocomplete="current-password" />
          <button mat-icon-button matSuffix type="button" (click)="hidePassword.set(!hidePassword())" [attr.aria-label]="'Toggle password visibility'">
            <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          @if (form.get('password')?.hasError('required')) {
            <mat-error>Password is required</mat-error>
          }
        </mat-form-field>
        @if (error()) {
          <div class="error-message">{{ error() }}</div>
        }
        <button mat-flat-button color="primary" type="submit" [disabled]="loading()" class="full-width login-btn">
          @if (loading()) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            <span>Sign In</span>
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
