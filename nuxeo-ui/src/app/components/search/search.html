<div class="search-container">
  <h2>Search Documents</h2>
  <div class="search-bar">
    <mat-form-field appearance="outline" class="search-input">
      <mat-label>Search query</mat-label>
      <input matInput [formControl]="searchControl" (keyup.enter)="search()" placeholder="Enter keywords..." />
      <mat-icon matPrefix>search</mat-icon>
    </mat-form-field>
    <button mat-flat-button color="primary" (click)="search()" [disabled]="loading()">
      Search
    </button>
  </div>

  <div *ngIf="loading()" class="loading">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <div *ngIf="error()" class="error-message">
    <mat-icon>error</mat-icon>
    {{ error() }}
  </div>

  <div *ngIf="searched() && !loading() && results().length === 0 && !error()" class="no-results">
    <mat-icon>search_off</mat-icon>
    <p>No results found</p>
  </div>

  <table mat-table [dataSource]="results()" *ngIf="results().length > 0 && !loading()" class="results-table mat-elevation-z2">
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let doc">
        <a (click)="openDocument(doc)" class="doc-link">{{ doc.title }}</a>
      </td>
    </ng-container>
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let doc"><mat-chip-set><mat-chip>{{ doc.type }}</mat-chip></mat-chip-set></td>
    </ng-container>
    <ng-container matColumnDef="path">
      <th mat-header-cell *matHeaderCellDef>Path</th>
      <td mat-cell *matCellDef="let doc" class="path-cell">{{ doc.path }}</td>
    </ng-container>
    <ng-container matColumnDef="lastModified">
      <th mat-header-cell *matHeaderCellDef>Last Modified</th>
      <td mat-cell *matCellDef="let doc">{{ doc.lastModified | date:'medium' }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let doc">
        <button mat-icon-button (click)="openDocument(doc)"><mat-icon>open_in_new</mat-icon></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="result-row"></tr>
  </table>
</div>
