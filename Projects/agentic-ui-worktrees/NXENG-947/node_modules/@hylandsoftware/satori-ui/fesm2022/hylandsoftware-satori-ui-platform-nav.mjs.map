<button
  matRipple
  matRippleColor="var(--sat-sys-on-primary-opacity-12)"
  id="sat-platform-nav-env-switcher-button"
  aria-haspopup="listbox"
  [attr.aria-expanded]="trigger.isOpen()"
  aria-controls="sat-platform-nav-env-switcher-menu"
  [attr.aria-label]="'sat.platform-nav.environment-switcher.trigger-label' | translate"
  aria-describedby="sat-platform-nav-env-switcher-button-value"
  [matTooltip]="
    satPlatformNavStateService.collapsed() && selectedEnv()
    ? ('sat.platform-nav.environment-switcher.trigger-tooltip-prefix' | translate)  + selectedEnv()?.label
    : null
  "
  matTooltipPosition="right"
  tabindex="0"
  [cdkMenuTriggerFor]="switcherMenu"
  [disabled]="disabled()"
  #trigger="cdkMenuTriggerFor"
  class="sat-platform-nav-switcher-button sat-platform-nav-item"
  [class.sat-platform-nav-switcher-button--disabled]="disabled()"
>
  <div class="sat-platform-nav-switcher-button-text">
    <div class="sat-platform-nav-icon">
      <mat-icon svgIcon="cloud" aria-hidden="true"></mat-icon>
    </div>

    @if (!satPlatformNavStateService.collapsed()) {
      <div class="sat-platform-nav-switcher-button-name">
        <span
          class="sat-platform-nav-switcher-button-label"
          id="sat-platform-nav-env-switcher-button-label"
        >
          {{ 'sat.platform-nav.environment-switcher.trigger-label' | translate }}
        </span>
        <span
          class="sat-platform-nav-switcher-button-value"
          id="sat-platform-nav-env-switcher-button-value"
        >
          {{selectedEnv()?.label}}
        </span>
      </div>
    }
  </div>

  <mat-icon
    class="sat-platform-nav-switcher-button-suffix-icon"
    svgIcon="arrow_submenu_down"
    aria-hidden="true"
    iconPositionEnd
  >
  </mat-icon>
</button>

<ng-template #switcherMenu>
  <div
    cdkMenu
    role="listbox"
    aria-multiselectable="false"
    [attr.aria-activedescendant]="selectedEnv()?.value"
    aria-labelledby="sat-platform-nav-env-switcher-button-label"
    id="sat-platform-nav-env-switcher-menu"
    [class.sat-platform-nav-switcher-menu--expanded]="!satPlatformNavStateService.collapsed()"
    class="sat-platform-nav-switcher-menu"
  >
    <div cdkMenuGroup style="width: 100%;">
      @for (environment of environments(); track environment) {
        <sat-platform-nav-switcher-item
          cdkMenuItemRadio
          [id]="environment.value"
          [value]="environment.value"
          [disabled]="environment.disabled"
          [active]="selectedEnv()?.value === environment.value"
          (selectionChange)="onSelect(environment)"
        >
          {{ environment.label }}
        </sat-platform-nav-switcher-item>
      }
    </div>
  </div>
</ng-template>
