<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Satori Icons</title>
    <style>
      body {
        font-family: sans-serif;  
        color: black;  
        background-color: white;  
      }

      .icon-wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 10px 0;
      }

      .icon-label {
        font-size: 14px;
        color: #4b4b4b;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import { SATORI_ICONS } from './index.mjs';

      const wrapper = document.createElement('div');
      wrapper.innerHTML = SATORI_ICONS;

      const defs = wrapper.querySelector('defs');
      const svgs = defs?.querySelectorAll('svg');

      const output = new DocumentFragment();

      svgs?.forEach((svg) => {
        const iconId = svg.id ?? '(no id)';

        // Create a container for icon + label
        const iconWrapper = document.createElement('div');
        iconWrapper.classList.add('icon-wrapper');

        // Clone SVG so we don't mutate the original
        const iconElement = svg.cloneNode(true);

        // Create label
        const label = document.createElement('span');
        label.classList.add('icon-label');
        label.textContent = iconId;

        iconWrapper.appendChild(iconElement);
        iconWrapper.appendChild(label);
        output.appendChild(iconWrapper);
      });

      document.body.appendChild(output);
    </script>
  </body>
</html>
