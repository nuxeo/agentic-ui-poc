<header [style.padding-top.px]="headerPaddingTop()">
  <div
    class="sat-app-header-content-container"
    [class.sat-app-header-sticky-content-container]="shouldStick()"
  >
    <div
      #appHeaderContent
      class="sat-app-header-content"
      [class.sat-app-header-sticky-content]="shouldStick()"
      [style.width.px]="stickyContentWidth()"
    >
      <div class="sat-app-header-leading-container">
        <ng-content select="[satAppHeaderLeadingAction]"></ng-content>
        <ng-content select="[satAppHeaderPlatformNavMobileTrigger]"></ng-content>
        <ng-content select="[satAppHeaderTitle], [satHeaderTitle]"></ng-content>
      </div>
      <div class="sat-app-header-trailing-container">
        <ng-content select="[satAppHeaderLogo], [satHeaderLogo]"></ng-content>
        <ng-content select="[satAppHeaderActions], [satHeaderActions]"></ng-content>
      </div>
    </div>
  </div>
  <ng-content select="[satAppHeaderNavigation], [satHeaderNavigation]"></ng-content>
</header>
