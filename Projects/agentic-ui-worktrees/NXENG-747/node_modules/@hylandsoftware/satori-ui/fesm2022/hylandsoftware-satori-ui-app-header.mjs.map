<header>
  <div class="sat-app-header-content-container">
    <div class="sat-app-header-content">
      <div class="sat-app-header-leading-container">
        <ng-content select="[satAppHeaderTitle], [satHeaderTitle]"></ng-content>
      </div>
      <div class="sat-app-header-trailing-container">
        <ng-content select="[satAppHeaderLogo], [satHeaderLogo]"></ng-content>
        <ng-content select="[satAppHeaderActions], [satHeaderActions]"></ng-content>
      </div>
    </div>
  </div>
  <ng-content select="[satAppHeaderNavigation], [satHeaderNavigation]"></ng-content>
</header>
