<ng-template #richTooltipContainer>
  <div
    class="sat-rich-tooltip-container mat-elevation-z2"
    [attr.tabindex]="null"
    [attr.role]="resolvedRole()"
    [attr.aria-modal]="isPersistent() ? 'false' : null"
    [attr.aria-labelledby]="isPersistent() ? titleId : null"
    [attr.aria-describedby]="isPersistent() ? contentId : null"
    [class.sat-rich-tooltip-overlap]="overlapTrigger()"
    (keydown)="handleKeydown($event)"
    (mouseover)="onMouseover()"
    (mouseleave)="onMouseout()"
    (focus)="doNothing()"
    [cdkTrapFocus]="isPersistent() && focusTrapEnabled()"
    [cdkTrapFocusAutoCapture]="isPersistent() && focusTrapAutoCaptureEnabled()"
    [animate.enter]="disableAnimation() ? null : 'sat-rich-tooltip-enter'"
    [animate.leave]="disableAnimation() ? null : 'sat-rich-tooltip-leave'"
  >
    <ng-content select="sat-rich-tooltip-title"></ng-content>
    <ng-content select="sat-rich-tooltip-content"></ng-content>
    <ng-content select="sat-rich-tooltip-actions"></ng-content>
  </div>
</ng-template>
@if (!isPersistent()) {
  <div class="cdk-visually-hidden" [attr.id]="descriptionId">
    {{ descriptionText() }}
  </div>
}
