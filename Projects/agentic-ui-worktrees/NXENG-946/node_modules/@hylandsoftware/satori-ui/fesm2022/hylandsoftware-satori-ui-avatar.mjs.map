<div
  [class]="'sat-avatar sat-avatar-' + size()"
  [class.sat-avatar-borderless]="borderless()"
  [style.backgroundColor]="_backgroundColor()"
  [style.color]="_color()"
>
  <ng-content select="img"></ng-content>
  <span aria-hidden="true">{{_displayedInitials()}}</span>
  @switch (indicator()) {
    @case ('active') {
      <sat-avatar-active-indicator></sat-avatar-active-indicator>
    }
    @case ('away') {
      <sat-avatar-away-indicator></sat-avatar-away-indicator>
    }
    @case ('offline') {
      <sat-avatar-offline-indicator></sat-avatar-offline-indicator>
    }
    @case ('readonly') {
      <sat-avatar-readonly-indicator></sat-avatar-readonly-indicator>
    }
  }
</div>
