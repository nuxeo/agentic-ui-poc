<div class="hxp-dialog-fixed-size-wrapper">
    <div mat-dialog-title class="dialog-title">
        <h1 mat-dialog-title>{{ dialogTitle | translate }}</h1>
        <button class="hxp-dialog-fixed-size-wrapper-close-btn" aria-label="close dialog" mat-dialog-close>
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <div mat-dialog-content class="hxp-fixed-dialog-content-height">
        <p> {{ dialogDescription | translate }} </p>
    </div>
    <mat-dialog-actions [align]="'end'">
        <button mat-button class="hxp-text-button" mat-dialog-close>{{ 'DOCUMENT_DELETE.APP.DIALOGS.DELETE.BUTTONS.CANCEL' | translate }}</button>
        <button mat-flat-button color="warn" class="hxp-primary-warn-button" [ngClass]="{'hxp-disable-btn': isDeleting}" (click)="onDelete()">
            <span class="hxp-primary-warn-button-label">
                <mat-progress-spinner
                    *ngIf="isDeleting"
                    mode="indeterminate"
                    diameter="15" />
                {{ dialogTitle | translate }}
            </span>
        </button>
    </mat-dialog-actions>
</div>
