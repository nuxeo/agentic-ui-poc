<div class="hxp-cancel-permission-dialog">
    <h1 mat-dialog-title>{{ dialogData.dialogTitle | translate}}</h1>
    <div mat-dialog-content>
        <p>{{ dialogData.dialogDescription | translate}}</p>
    </div>
    <div mat-dialog-actions [align]="'end'">
        <button mat-flat-button disableRipple class="hxp-permission-dialog-reject-button hxp-text-button" (click)="reject()">
            {{ dialogData.dialogRejectButton | translate}}
        </button>
        <button mat-button class="hxp-permission-dialog-confirm-button hxp-primary-button" (click)="confirm()">
            {{ dialogData.dialogConfirmButton | translate}}
        </button>
    </div>
</div>
