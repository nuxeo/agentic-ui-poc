<hxp-search-filter-container
        #searchFilter
        [name]="'SEARCH.FILTERS.FILE_TYPE.LABEL' | translate"
        [selectedValue]="selectedValue"
        [filterForm]="filterForm"
        (filterApplied)="applyFilter()"
        (filterCleared)="clearFilter()"
        (overlayClosed)="overlayClosed()"
    >
        <div class="hxp-file-type-search-filter-container">
            <hxp-search-filter-input
                [inputAriaLabel]="'SEARCH.FILTERS.FILE_TYPE.LABEL' | translate"
                [placeholder]="'SEARCH.FILTERS.FILE_TYPE.PLACEHOLDER' | translate"
                [clearAriaLabel]="'SEARCH.FILTERS.FILE_TYPE.ARIA-LABEL.CLEAR_INPUT' | translate"
                (search)="filteredSearch($event)"
                (clear)="clearSearchInput()"
            />
            <div class="hxp-file-type-search-filter-summary">
                <mat-chip-set
                    ariaLabel="
                        'SEARCH.FILTERS.FILE_TYPE.ARIA-LABEL.SELECTED_FILTERS'
                            | translate
                    "
                    class="hxp-file-type-search-filter-summary-list"
                >
                    <span
                        class="hxp-file-type-search-filter-summary-list-prefix"
                    >
                        {{
                            'SEARCH.FILTERS.FILE_TYPE.SELECTED'
                                | translate
                                    : { selected: selection.selected.length }
                        }}
                    </span>
                    <span
                        *ngIf="selection.selected.length > 0"
                        class="hxp-file-type-search-filter-summary-list-colon"
                        >:</span
                    >
                    <mat-chip
                        *ngFor="let selectedFileType of selection.selected"
                        class="hxp-file-type-search-filter-summary-list-item"
                        [attr.aria-label]="selectedFileType"
                        [matTooltip]="selectedFileType.extensions | arrayToString"
                    >
                        <span
                            class="hxp-file-type-filter-summary-list-item__label"
                        >
                            {{ (selectedFileType.label | translate) + ' (' + (selectedFileType.extensions | arrayToString) + ')' }}
                        </span>
                        <button
                            matChipRemove
                            [attr.aria-label]="
                                ('SEARCH.FILTERS.FILE_TYPE.ARIA-LABEL.REMOVE'
                                    | translate) +
                                ' ' +
                                selectedFileType
                            "
                            (click)="toggleSelection(selectedFileType)"
                        >
                            <mat-icon
                                class="hxp-file-type-search-filter-summary-list-remove-item-icon"
                                svgIcon="search_clear"
                                />
                        </button>
                    </mat-chip>
                </mat-chip-set>
            </div>

            <hxp-file-type-search-filter-tree
                (selectedFileTypes)="onSelectedFileType($event)"
                [filteredFileType]="searchTerm"
            />
        </div>
</hxp-search-filter-container>
