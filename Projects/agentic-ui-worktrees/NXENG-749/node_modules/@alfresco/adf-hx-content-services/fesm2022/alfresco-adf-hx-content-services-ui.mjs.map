<button *ngIf="isAvailable"
    mat-icon-button
    class="hxp-content-share-button"
    [attr.aria-label]="'DOCUMENT_SHARE.TOOLBAR.BUTTONS.SHARE.ARIA-LABEL' | translate"
    title="{{ 'DOCUMENT_SHARE.TOOLBAR.BUTTONS.SHARE.TITLE' | translate }}"
    matTooltip="{{ 'DOCUMENT_SHARE.TOOLBAR.BUTTONS.SHARE.TITLE' | translate }}"
    (click)="onShare()">
    <mat-icon>share</mat-icon>
</button>
