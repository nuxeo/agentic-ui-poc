<adf-breadcrumb [compact]="compact" data-testid="breadcrumb">
    <adf-breadcrumb-item
        *ngFor="
            let doc of documents;
            last as isLast;
            trackBy: documentTrackBy
        "
    >
        <a
            *ngIf="!!doc else notNavigable"
            [routerLink]="!isLast ? (doc | urlFor) : undefined"
            [attr.aria-current]="isLast ? 'location' : undefined"
        >
            {{ doc | breadcrumbLabel: 'DOCUMENT_BREADCRUMB.ROOT' }}
        </a>
        <ng-template #notNavigable>
            <span class="hxp-not-navigable-folder">
               ...
            </span>
        </ng-template>
    </adf-breadcrumb-item>
</adf-breadcrumb>
