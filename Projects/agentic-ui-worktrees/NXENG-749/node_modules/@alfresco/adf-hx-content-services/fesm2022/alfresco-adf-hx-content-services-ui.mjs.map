<adf-viewer
    id="hxp-viewer"
    #viewer
    *ngIf="document"
    [allowFullScreen]="true"
    [allowRightSidebar]="!!sidebarTemplateRef"
    [showViewer]="true"
    [overlayMode]="true"
    [blobFile]="(blobFile$ | async)!"
    (showViewerChange)="onClose()"
>
    <adf-viewer-toolbar class="hxp-document-viewer-toolbar">
        <ng-container *ngTemplateOutlet="toolbarTemplateRef || toolbar" />
    </adf-viewer-toolbar>
    <adf-viewer-sidebar *ngIf="sidebarTemplateRef">
        <ng-container *ngTemplateOutlet="sidebarTemplateRef" />
    </adf-viewer-sidebar>
</adf-viewer>
<ng-template #toolbar />
