<mat-tree
    *ngIf="dataSource?.data?.length; else noResults"
    [dataSource]="dataSource"
    [treeControl]="treeControl"
    class="hxp-file-type-tree"
>
    <mat-tree-node
        *matTreeNodeDef="let node"
        matTreeNodeToggle
        matTreeNodePadding
    >
        <button mat-icon-button disabled></button>
        <mat-checkbox
            [checked]="fileTypeSelection.isSelected(node)"
            (change)="leafItemSelectionToggle(node)"
        >
            <div class="hxp-mime-type-row">
                <hxp-mime-type-icon
                    [mimeType]="node?.mimeTypeIcon"
                    aria-hidden="true"
                />
                <div class="hxp-mime-type-description">
                    <span class="hxp-mime-type-description-title">{{
                        node.label | translate
                    }}</span>
                    <span class="hxp-mime-type-description-extensions">{{
                        node.extensions | arrayToString
                    }}</span>
                </div>
            </div>
        </mat-checkbox>
    </mat-tree-node>

    <mat-tree-node
        *matTreeNodeDef="let node; when: hasChild"
        matTreeNodePadding
    >
        <button
            mat-icon-button
            matTreeNodeToggle
            [attr.aria-label]="'Toggle ' + node.label"
            (click)="onNodeExpand($event)"
        >
            <mat-icon class="mat-icon-rtl-mirror">
                {{
                    treeControl.isExpanded(node)
                        ? 'expand_more'
                        : 'chevron_right'
                }}
            </mat-icon>
        </button>
        <mat-checkbox
            [checked]="descendantsAllSelected(node)"
            [indeterminate]="descendantsPartiallySelected(node)"
            (change)="fileTypeSelectionToggle(node)"
        >
            <span class="hxp-mime-type-parent-label hxp-label-bold">{{ node.label | translate }}</span>
        </mat-checkbox>
    </mat-tree-node>
</mat-tree>

<ng-template #noResults>
    <div class="hxp-file-type-no-results">
        <h2>
            {{ 'SEARCH.FILTERS.FILE_TYPE.NO_SEARCH_RESULTS.TITLE' | translate }}
        </h2>
        <p>
            {{
                'SEARCH.FILTERS.FILE_TYPE.NO_SEARCH_RESULTS.MESSAGE' | translate
            }}
        </p>
    </div>
</ng-template>
