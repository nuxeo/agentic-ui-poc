<adf-info-drawer-layout>
    <div info-drawer-content>
        <div class="hxp-property-panel-header">
            <div class="hxp-property-panel-header_title mat-h1">{{ selectedDocument?.sys_title }}</div>
            <button mat-icon-button attr.aria-label="{{ 'DOCUMENT.PROPERTIES.RIGHT_SIDEBAR.CLOSE' | translate }}"
                (click)="onClose()" class="hxp-property-sidebar-close-button">
                <mat-icon>close</mat-icon>
            </button>
        </div>
        <adf-info-drawer>
            <adf-info-drawer-tab label="Properties">
                @if (propertyLoading) {
                    <div class="hxp-property-panel-spinner-container">
                        <mat-progress-spinner mode="indeterminate" diameter="30" />
                    </div>
                } @else {
                    @if (documentProperties$ | async; as documentProperties) {
                        <hxp-properties-viewer-content [expanded]="true" [useChipsForMultiValueProperty]="false"
                            [properties]="documentProperties" headerText="DOCUMENT.PROPERTIES.VIEWER.MAIN.CONTAINER.HEADER"
                            id="properties-viewer-content" [editable]="editable" [document]="selectedDocument"
                            (propertyUpdateRequest)="handlePropertyUpdate($event)" />

                    }
                    @if (otherDocumentProperties$ | async; as otherProperties) {
                        <hxp-properties-viewer-content *ngIf="otherProperties.length > 0" [expanded]="false"
                            [useChipsForMultiValueProperty]="true" [displayLabelForChips]="true" [properties]="otherProperties"
                            headerText="DOCUMENT.PROPERTIES.VIEWER.OTHER.CONTAINER.HEADER" id="properties-viewer-content"
                            [editable]="editable" [document]="selectedDocument" (propertyUpdateRequest)="handlePropertyUpdate($event)" />
                    }
                }
            </adf-info-drawer-tab>
        </adf-info-drawer>
    </div>
</adf-info-drawer-layout>
