<div class="hxp-version-edit-dialog">
    <h1 mat-dialog-title>{{ 'MANAGE_VERSIONS.EDIT_DIALOG.TITLE' | translate }}</h1>
    <mat-dialog-content>
        <form [formGroup]="form" class="hxp-version-edit-dialog-form">
            <div class="hxp-version-edit-dialog-input-area">
                <div class="hxp-version-edit-dialog-input-title">
                    <mat-label>{{ 'MANAGE_VERSIONS.EDIT_DIALOG.FIELD_TITLE' | translate }}</mat-label>
                </div>
                <div class="hxp-input-area" data-automation-id="hxp-document-version-edit-title">
                    <mat-form-field class="hxp-edit-form-field">
                        <input matInput formControlName="sysver_title" (keydown)="$event.stopPropagation()" />
                    </mat-form-field>
                </div>
            </div>
            <div class="hxp-version-edit-dialog-input-area" data-automation-id="hxp-document-version-edit-description">
                <div class="hxp-version-edit-dialog-input-title">
                    <mat-label>{{ 'MANAGE_VERSIONS.EDIT_DIALOG.DESCRIPTION' | translate }}</mat-label>
                </div>
                <div class="hxp-input-area">
                    <mat-form-field class="hxp-edit-form-field" hideRequiredMarker>
                        <textarea
                            matInput
                            formControlName="sysver_description"
                            placeholder="{{ 'MANAGE_VERSIONS.EDIT_DIALOG.PLACEHOLDER_DESCRIPTION' | translate }}"
                            (keydown)="$event.stopPropagation()"
                        >
                        </textarea>
                    </mat-form-field>
                </div>
            </div>
        </form>
    </mat-dialog-content>
    <mat-dialog-actions [align]="'end'" class="hxp-version-edit-dialog-footer-action">
        <button mat-button class="hxp-text-button" mat-dialog-close>{{ 'MANAGE_VERSIONS.EDIT_DIALOG.BUTTONS.CANCEL' | translate }}</button>
        <button mat-button class="hxp-primary-button" [disabled]="form.invalid || isUpdating" [ngClass]="{'hxp-loading': isUpdating}" (click)="onSave()">
            <span class="hxp-version-edit-dialog-save-btn-label">
                @if (isUpdating) {
                    <mat-progress-spinner mode="indeterminate" diameter="15" />
                }
                <span class="hxp-version-edit-dialog-save-btn-title">
                    {{ 'MANAGE_VERSIONS.EDIT_DIALOG.BUTTONS.SAVE' | translate }}
                </span>
            </span>
        </button>
    </mat-dialog-actions>
</div>
