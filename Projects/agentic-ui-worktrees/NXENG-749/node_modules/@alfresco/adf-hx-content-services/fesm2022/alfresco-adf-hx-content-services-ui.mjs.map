<div class="hxp-skeleton-table-container">
    <table class="hxp-skeleton-table" aria-hidden="true" *ngFor="let i of skeletonRowArray; trackBy: skeletonRowTrackBy">
        <tbody>
            <tr>
                <td><div class="hxp-skeleton-box hxp-skeleton-text-50"></div></td>
            </tr>
            <tr>
                <td><div class="hxp-skeleton-box hxp-skeleton-text-25"></div></td>
            </tr>
            <tr>
                <td><div class="hxp-skeleton-box hxp-skeleton-text-100"></div></td>
            </tr>
            <tr>
                <td><div class="hxp-skeleton-box hxp-skeleton-text-25"></div></td>
            </tr>
        </tbody>
    </table>
</div>
