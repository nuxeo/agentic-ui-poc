<h2 mat-dialog-title>{{ 'shared-ui.share-dialog.share-the-document' | translate }}</h2>

<mat-dialog-content>
  <p class="share-subtitle">
    {{ 'shared-ui.share-dialog.internal-access-link-to' | translate: { name: data.title } }}
  </p>
  <div class="share-link-row">
    <input
      class="share-link-input"
      readonly
      [value]="data.url"
      #linkInput
      [attr.aria-label]="'shared-ui.share-dialog.share-link' | translate"
    />
    <button
      mat-icon-button
      class="copy-btn"
      (click)="copyLink()"
      [attr.aria-label]="'shared-ui.share-dialog.copy-link' | translate"
    >
      <mat-icon>link</mat-icon>
    </button>
  </div>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-flat-button color="primary" mat-dialog-close>
    {{ 'shared-ui.share-dialog.close' | translate }}
  </button>
</mat-dialog-actions>
