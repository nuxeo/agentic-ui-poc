<button
  #trigger
  mat-icon-button
  type="button"
  class="nxs-rich-tooltip__trigger"
  [attr.aria-label]="triggerLabel()"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="panelId"
  (pointerdown)="onPointerDown()"
  (focus)="onFocus()"
  (click)="onClick()"
>
  <mat-icon aria-hidden="true">{{ icon() }}</mat-icon>
</button>
<div class="nxs-rich-tooltip__live" role="status">
  @if (open()) {
    <div
      #panel
      class="nxs-rich-tooltip__panel"
      [id]="panelId"
      [style.translate.px]="shift() || null"
    >
      <p class="nxs-rich-tooltip__heading">{{ heading() }}</p>
      <p class="nxs-rich-tooltip__content">{{ content() }}</p>
    </div>
  }
</div>
