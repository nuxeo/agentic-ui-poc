name: Release — Nuxeo AI Package

on:
  # Manual trigger from GitHub UI with optional version override
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1). Defaults to the version in pom.xml.'
        required: false
        default: ''

  # Auto-trigger when a semver tag is pushed: git tag v1.0.0 && git push --tags
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: java-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub Releases

    defaults:
      run:
        working-directory: apps/nuxeo-ai-package

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      # ── Resolve the release version ──────────────────────────────────────
      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      # ── Update pom.xml version if overridden ─────────────────────────────
      - name: Set Maven version
        if: steps.version.outputs.VERSION != ''
        run: |
          mvn versions:set -DnewVersion=${{ steps.version.outputs.VERSION }} -DgenerateBackupPoms=false -B

      # ── Build the Marketplace ZIP ─────────────────────────────────────────
      - name: Build package
        run: mvn clean package -DskipTests -B
        env:
          MAVEN_OPTS: -Xmx1024m

      # ── Locate the ZIP ────────────────────────────────────────────────────
      - name: Find ZIP path
        id: zip
        run: |
          ZIP=$(find nuxeo-ai-package/target -name "nuxeo-ai-operations-*.zip" | head -1)
          echo "ZIP_PATH=$ZIP" >> $GITHUB_OUTPUT
          echo "ZIP_NAME=$(basename $ZIP)" >> $GITHUB_OUTPUT
          echo "Built: $ZIP"

      # ── Upload to GitHub Actions artifacts ───────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.ZIP_NAME }}
          path: apps/nuxeo-ai-package/${{ steps.zip.outputs.ZIP_PATH }}
          retention-days: 90

      # ── Create GitHub Release with the ZIP attached ───────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Nuxeo AI Operations v${{ steps.version.outputs.VERSION }}
          body: |
            ## Nuxeo AI Operations — Marketplace Package v${{ steps.version.outputs.VERSION }}

            ### Install
            1. Download `nuxeo-ai-operations-${{ steps.version.outputs.VERSION }}.zip` below
            2. Upload to **Nuxeo Admin Center → Update Center → Local packages**
            3. Add to `nuxeo.conf`:
               ```
               haip.api.key=sk-...
               haip.base.url=https://ai-platform-public.api.ai.dev.app.hyland.com
               haip.model=anthropic.claude-3-5-sonnet-20241022-v2:0
               haip.model.fast=amazon.nova-micro-v1:0
               ```
            4. Restart Nuxeo

            ### Operations included
            `AI.Summarize` · `AI.Insights` · `AI.SuggestTags` · `AI.Classify` · `AI.Chat`
            `AI.NlToNxql` · `AI.Sentiment` · `AI.Similar` · `AI.Anomalies`
            `AI.NlPermissions` · `AI.AuditNlFilter` · `AI.AuditSummarize`
          files: apps/nuxeo-ai-package/${{ steps.zip.outputs.ZIP_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
