# Uploads English to Crowdin when a source catalogue changes.
#
# One of the two workflows D8 in `docs/i18n-localization-plan.md` calls for. Push and pull are
# separate because they fail for different reasons and on different schedules: an upload
# failure means the source is wrong and blocks a developer, a download failure means the
# translation pull request did not open and blocks nobody until tomorrow. Merging them into
# one job makes the second look like the first.
#
# `nuxeo-web-ui` runs a single combined workflow. The divergence is deliberate and is D8's.
name: Crowdin Push

on:
  push:
    branches: ['main']
    paths:
      - 'apps/*/public/i18n/en.json'
      - 'apps/*/public/i18n/en.context.json'
      - 'libs/**/i18n/en.json'
      # The library context glob was missing while the catalogue one was present, which made
      # translator guidance a second-class trigger: `crowdin-push-context.mjs` discovers every
      # `libs/**/i18n/en.context.json`, so editing one alone changed what the job would upload and
      # yet started nothing. Crowdin then held stale context until some later catalogue change or a
      # manual run — and stale context is worse than none, because a translator believes it.
      - 'libs/**/i18n/en.context.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Resolve and authenticate against Crowdin without uploading anything'
        type: boolean
        default: false
      seed_translations:
        description: 'Also upload the existing non-English catalogues as approved translations'
        type: boolean
        default: false

concurrency:
  group: crowdin-push
  cancel-in-progress: false

jobs:
  push-sources:
    # Off until the Crowdin project exists.
    #
    # Without this the schedule and the push trigger both go live on merge and fail every day
    # against secrets that are not set — S6 is blocked on manual project creation through the
    # INTERN board. A workflow that is red for a reason nobody can fix is a workflow people
    # learn to ignore, and it will be ignored on the day it is red for a real reason.
    #
    # Same `*_ENABLED` variable convention as `GPG_BOT_SIGNING_ENABLED`, see
    # `docs/github-bot-commit-signing.md`.
    if: vars.CROWDIN_SYNC_ENABLED == 'true'

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Upload sources to Crowdin
        uses: crowdin/github-action@8868a33591d21088edfc398968173a3b98d51706 # v2.16.2
        with:
          config: crowdin-conf.yml
          upload_sources: true
          # A key that no longer exists in English is dead weight the translation crew is still
          # paying to maintain, and it will be offered to a translator who has no way to know
          # it renders nowhere.
          # `--dryrun`, one word. The Crowdin CLI rejects `--dry-run` outright — "Unknown
          # option: '--dry-run'. Possible solutions: --dryrun" — and it rejects it while parsing
          # arguments, BEFORE authenticating, so the first attempt failed without telling us
          # anything about the token it was meant to test.
          #
          # On a manual run, so the first contact with a real tenant can be made
          # without writing to it. It exercises the parts most likely to be wrong — the token,
          # the project id, the base_url and which files the globs resolve to — and reports
          # them without creating a string.
          upload_sources_args: ${{ inputs.dry_run && '--delete-obsolete --dryrun' || '--delete-obsolete' }}
          # No `auto_approve_imported` here, and the reason is worth recording rather than
          # rediscovering. It was set to `true` with a comment claiming it kept source strings off
          # the Crowdin review queue. It does nothing in this step: the pinned action feeds that
          # input into `UPLOAD_TRANSLATIONS_OPTIONS` only —
          #   if [ "$INPUT_AUTO_APPROVE_IMPORTED" = true ]; then
          #     UPLOAD_TRANSLATIONS_OPTIONS="... --auto-approve-imported"
          # — and this step uploads sources, not translations. A setting that reads as a guarantee
          # and changes nothing is worse than its absence. If source-string approval turns out to
          # matter, it needs the Crowdin API and something asserting it worked.
          download_translations: false
          create_pull_request: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      # Crowdin was created after the repository, so it started empty while `fr.json` and
      # `de.json` already held 75 and 76 hand-written strings. Nothing had told Crowdin they
      # existed, which made every pull destructive by construction: whatever the export contains
      # replaces the file, and an export from an empty project cannot contain them.
      # `skip_untranslated_strings` changes how they are lost, not whether — English values before
      # it, absent keys after.
      #
      # `auto_approve_imported` is required rather than tidy. `export_only_approved: 'true'` in
      # `crowdin-conf.yml` means an unapproved translation is not exported at all, so seeding
      # without approving would leave these 151 strings visible in Crowdin and still missing from
      # every pull — the same data loss with a more confusing cause. Note this input is only wired
      # into the action's translation upload; on the source step above it does nothing, which is
      # why it is set here and not there.
      #
      # It is a judgement call and reviewers should see it as one: it marks 151 strings approved
      # that no translator has read. They ship today, so approving preserves the status quo rather
      # than adding unreviewed content, and a translator can revise any of them in Crowdin
      # afterwards. The alternative was discarding work that is already in front of users.
      #
      # One-off in practice, but safe to repeat — re-uploading identical approved translations
      # changes nothing.
      - name: Seed existing translations into Crowdin
        if: ${{ inputs.seed_translations && !inputs.dry_run }}
        uses: crowdin/github-action@8868a33591d21088edfc398968173a3b98d51706 # v2.16.2
        with:
          config: crowdin-conf.yml
          upload_sources: false
          upload_translations: true
          auto_approve_imported: true
          download_translations: false
          create_pull_request: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      # Only after the sources exist: context attaches to strings Crowdin already holds. Skipped
      # on a dry run for the same reason — on a dry run the strings were never created, so every
      # lookup would miss and the script would exit non-zero reporting a divergence that is an
      # artefact of the dry run rather than a real one.
      - name: Push translator context
        if: ${{ !inputs.dry_run }}
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: node tools/i18n/crowdin-push-context.mjs
