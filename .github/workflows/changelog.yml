name: Changelog Agent

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  changelog:
    runs-on: ubuntu-latest
    # Only run if the push was not from the changelog bot itself
    if: "!contains(github.event.head_commit.message, 'chore: update CHANGELOG')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate changelog from Conventional Commits
        run: |
          npx --yes conventional-changelog-cli \
            -p angular \
            -i CHANGELOG.md \
            -s \
            --commit-path . \
            || echo "No conventional commits found — CHANGELOG.md unchanged."

      - name: Commit updated CHANGELOG.md if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet CHANGELOG.md || (
            git add CHANGELOG.md &&
            git commit -m "chore: update CHANGELOG [skip ci]" &&
            git push
          )
