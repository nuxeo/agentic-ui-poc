name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job checks out full history and then runs ./.github/actions/setup, which
# installs dependencies and exports NX_BASE / NX_HEAD. Additional gates (E2E,
# accessibility, visual regression) belong here as sibling jobs following the same
# two-step opening — see plan tasks C2 and C3.
jobs:
  lint-build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          satori-token: ${{ secrets.SATORI_GH_READONLY_TOKEN }}

      - name: Run review guardrails
        run: npm run review:guardrails -- --base=$NX_BASE --head=$NX_HEAD

      - name: Lint affected projects
        run: npx nx affected -t lint --base=$NX_BASE --head=$NX_HEAD

      - name: Build affected projects
        run: npx nx affected -t build --base=$NX_BASE --head=$NX_HEAD

      - name: Check bundle size (nuxeo-ui)
        shell: bash
        env:
          NUXEO_UI_BUNDLE_SIZE_LIMIT_BYTES: 5242880
        run: |
          set -euo pipefail

          if npx nx show projects --affected --base=$NX_BASE --head=$NX_HEAD --plain | grep -q "^nuxeo-ui$"; then
            rm -rf dist
            npx nx build nuxeo-ui --configuration=production

            bundle_size_bytes=$(
              find dist -type f \( -name '*.js' -o -name '*.css' \) -path '*/nuxeo-ui/*' -printf '%s\n' \
                | awk '{ total += $1 } END { print total + 0 }'
            )

            if [ "$bundle_size_bytes" -eq 0 ]; then
              echo "Failed to measure bundle size for nuxeo-ui: no built JS/CSS assets were found under dist."
              exit 1
            fi

            echo "nuxeo-ui bundle size: ${bundle_size_bytes} bytes"
            echo "nuxeo-ui bundle size limit: ${NUXEO_UI_BUNDLE_SIZE_LIMIT_BYTES} bytes"

            if [ "$bundle_size_bytes" -gt "$NUXEO_UI_BUNDLE_SIZE_LIMIT_BYTES" ]; then
              echo "nuxeo-ui bundle size exceeds limit."
              exit 1
            fi
          else
            echo "nuxeo-ui is not affected; skipping bundle size check."
          fi

  test:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          satori-token: ${{ secrets.SATORI_GH_READONLY_TOKEN }}

      # --parallel=1 is deliberate: Vitest and Karma targets contend on a GitHub
      # runner and exit without useful failure output when run concurrently.
      - name: Test affected projects
        run: npx nx affected -t test --base=$NX_BASE --head=$NX_HEAD --output-style=stream --parallel=1

      - name: Enforce coverage floors
        shell: bash
        run: |
          set -euo pipefail
          affected=$(npx nx show projects --affected --base=$NX_BASE --head=$NX_HEAD --plain | tr '\n' ',')
          node scripts/check-coverage.mjs --projects="$affected"
