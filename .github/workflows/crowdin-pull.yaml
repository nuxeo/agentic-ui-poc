# Opens a pull request with whatever has been translated and approved.
#
# The download half of the two-workflow model in the Hyland Crowdin standard, whose shape this
# follows: a daily scheduled pull opening a pull request is RECOMMENDED, and an on-demand
# `workflow_dispatch` is a SHOULD. Conformance is tracked in `D8-standard` of
# `docs/i18n-localization-plan.md`. Daily, because a translation finished on Tuesday should not
# wait for someone to remember.
#
# Daily is a POLL, not a publish. On a day with nothing approved this opens nothing. Measured on
# nuxeo/nuxeo-web-ui — a comparison, not an authority; it predates the standard and is not
# compliant with it — which has run the same schedule since 2022: 99 pull requests, 39 of them
# merged at a median lag of one day, none currently open. Thirty-nine merges across fifty-one
# months is roughly one a month — the release cadence, reached by the mechanism rather than by
# scheduling it. The numbers and the query behind them are in D8b; do not restate them from here.
#
# It merges nothing. The translation pull request is reviewed like any other, and reviewing it
# is a release-checklist line rather than a standing duty. See D8b in
# docs/i18n-localization-plan.md, which corrects an earlier claim in this repository that an
# unowned translation PR rots — the data says otherwise.
name: Crowdin Pull

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: crowdin-pull
  cancel-in-progress: false

jobs:
  pull-translations:
    # The off switch, not a "not yet" — see the note in crowdin-push.yaml. The project exists
    # and both halves have run; what this still guards is a fork or clone, which has none of
    # these secrets and would otherwise run this job on every push.
    if: vars.CROWDIN_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Fail loudly on a half-configured activation rather than quietly doing less.
      #
      # Every promise this job's own pull-request body makes depends on something here, and each
      # one used to degrade silently instead of stopping:
      #
      #   - Signing was gated on `GPG_BOT_SIGNING_ENABLED`, so enabling `CROWDIN_SYNC_ENABLED`
      #     alone produced UNSIGNED commits while the comment beside the step said "signed, like
      #     every other bot commit here".
      #   - `GITHUB_TOKEN` fell back to the default token, and a branch pushed with that starts no
      #     workflow run — so the translation pull request would arrive with no CI at all, while
      #     its body tells the reviewer `checkTranslationCatalogues` has run on it.
      #
      # Both are the same defect: an operator turns the sync on, the job goes green, and what it
      # actually delivered is weaker than what is documented. Whoever activates this gets told
      # exactly what is missing instead.
      - name: Check the activation is complete
        env:
          SIGNING_ENABLED: ${{ vars.GPG_BOT_SIGNING_ENABLED }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          missing=()
          [ "$SIGNING_ENABLED" = "true" ] || missing+=("vars.GPG_BOT_SIGNING_ENABLED must be 'true' — this job commits to main and every bot commit here is signed")
          [ -n "$GPG_PRIVATE_KEY" ] || missing+=("secrets.GPG_PRIVATE_KEY")
          [ -n "$GPG_PASSPHRASE" ] || missing+=("secrets.GPG_PASSPHRASE")
          [ -n "$CROWDIN_PROJECT_ID" ] || missing+=("secrets.CROWDIN_PROJECT_ID")
          [ -n "$CROWDIN_PERSONAL_TOKEN" ] || missing+=("secrets.CROWDIN_PERSONAL_TOKEN")
          [ -n "$BOT_GITHUB_TOKEN" ] || missing+=("secrets.BOT_GITHUB_TOKEN — the default GITHUB_TOKEN pushes a branch without starting a workflow, so the translation PR would arrive with no CI while its own body promises the catalogue gate has run on it")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::CROWDIN_SYNC_ENABLED is on but the activation is incomplete."
            for item in "${missing[@]}"; do echo "  - $item"; done
            echo "See docs/i18n-localization-plan.md D8 and docs/github-bot-commit-signing.md."
            exit 1
          fi
          echo "Activation complete: signing on, Crowdin credentials and bot token present."

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      # No host-level `crazy-max/ghaction-import-gpg` step here, deliberately.
      #
      # It was here, and it did nothing. `crowdin/github-action` declares `runs: using: docker`,
      # so it executes in its own container; importing a key into the runner's GnuPG home and
      # setting `git config --global commit.gpgsign` on the HOST leaves the container's git
      # untouched. The commit is made inside the container, so it would have been unsigned — while
      # a preflight step three lines up refused to run without signing configured, and the comment
      # on the step said "signed, like every other bot commit here".
      #
      # That is the third silent downgrade found in this one file, and the most convincing of the
      # three: the step existed, its inputs were correct, it would have succeeded, and it had no
      # effect on the thing it was there to guarantee. A step that cannot fail and cannot work is
      # worse than no step, because it answers the question nobody then asks again.
      #
      # The action takes `gpg_private_key` and `gpg_passphrase` of its own — verified against
      # action.yml at the pinned SHA — so signing is configured where the commit actually happens.
      # See docs/github-bot-commit-signing.md; this reuses the existing key rather than minting a
      # second one.

      - name: Download translations and open a pull request
        uses: crowdin/github-action@8868a33591d21088edfc398968173a3b98d51706 # v2.16.2
        with:
          # The action's own `git checkout "${GITHUB_REF#refs/heads/}"` would undo the `ref`
          # above on a scheduled run.
          skip_ref_checkout: true

          config: crowdin-conf.yml
          upload_sources: false
          download_translations: true

          # Leave an untranslated string OUT of the exported catalogue.
          #
          # The action defaults this to `false`, which does not mean "omit" — it means export the
          # string with its **English source as the translation**. The first real pull did exactly
          # that: nine catalogues byte-identical to `en.json`, and because the export covers the
          # whole file it overwrote the 75 French and 76 German strings that had been written by
          # hand. `Supprimer` came back as `Delete`, in a commit titled "update translations from
          # Crowdin".
          #
          # `true` omits the key instead, and `setFallbackLang('en')` renders English for it — the
          # behaviour `checkTranslationCatalogues` already calls "the fallback working as
          # designed", and it warns rather than fails on a missing key for precisely this reason.
          # So the honest state of a half-translated locale is a short catalogue, not a full one
          # padded with English.
          #
          # This is a DELIBERATE DEVIATION from a documented expectation. The Technical Usage
          # Guide states that "by default, missing translations will be filled with the reference
          # translation held by the source file", and considers `skip_untranslated_strings` "not
          # specifically useful". We set it anyway, because an English-padded catalogue at full
          # key parity is indistinguishable from a finished translation to every check we have —
          # `nuxeo-web-ui` ships `messages-cs.json` at 1,565 keys of which 1,558 ARE English, and
          # nothing there reports a problem. An omitted key is at least honest: the fallback
          # renders English and `checkTranslationCatalogues` reports the gap.
          #
          # A deviation from an expectation, not from a rule — the guide does not say MUST NOT.
          # Recorded in `D8-standard`.
          #
          # Flipping this back is caught by `checkCrowdinConfig`, which asserts this exact line.
          # Not by `checkCataloguesAreTranslated` — that one fails a catalogue whose every value
          # matches English, which is what the flip produced only while Crowdin was empty. Once
          # Crowdin holds translations of its own, the same flip yields 1,897 English values out
          # of 1,972, and 96% is a warning rather than a failure. Measured, not estimated. So the
          # catalogue check would go quiet precisely as the catalogue became worth protecting, and
          # the configuration assertion is the load-bearing one.
          skip_untranslated_strings: true

          # `skip_untranslated_files` is deliberately NOT set, and `checkCrowdinConfig` fails the
          # workflow if anyone sets it. It was set here briefly, alongside the option above, and
          # a guardrail was written REQUIRING it. Only one of the two can be active:
          #
          #   Technical Usage Guide: "export options `skip_untranslated_strings` and
          #   `skip_untranslated_files` are not specifically useful, and the former can lead to
          #   empty translations being exported (and only one of these options can be activated)."
          #
          # So setting both did not guard two losses. On the pinned toolchain it guarded NEITHER,
          # and not because one option quietly won — crowdin-cli 4.14.2 rejects the pair outright
          # in `PropertiesWithFilesBuilder.checkArgParams()` with "You cannot skip strings and
          # files at the same time", before the download runs. The pull would have failed without
          # downloading a byte, while a guardrail asserted the configuration was correct.
          #
          # `skip_untranslated_strings` is the one worth keeping, for the reason above: an
          # English-padded catalogue passes as finished, an empty one is loudly wrong and
          # `checkCataloguesAreTranslated` fails it. See D8h.

          create_pull_request: true
          localization_branch_name: crowdin-translations-update
          pull_request_base_branch_name: main
          pull_request_title: 'chore(i18n): new Crowdin translations'
          pull_request_body: |
            Opened by the Crowdin Pull workflow. Contains only catalogue files.

            This pull request **requests** approved-only export (`export_only_approved: 'true'`),
            so the intent is that everything here has been through review on the Crowdin side.
            Treat that as the intent rather than a guarantee until the project's own export
            settings are confirmed: the Crowdin Guidelines say project-level export settings take
            precedence over the settings a pipeline sends. Tracked as an owner action in
            `D8-standard`.

            **A catalogue shorter than `en.json` is expected, not a fault.** Untranslated
            strings are omitted rather than exported with their English source, so a locale
            carries only what has actually been translated and `setFallbackLang('en')` covers
            the rest. `checkTranslationCatalogues` warns about the missing keys and passes.

            What it does not catch is the opposite: a catalogue at *full* parity whose values
            are all English, which is what `skip_untranslated_strings: false` produces and
            which overwrote 151 hand-written strings the first time this ran. That one belongs
            to `checkCataloguesAreTranslated`. Both run on this pull request.

            Do not hand-edit a non-English catalogue to fix something here. Crowdin is the
            source of truth and overwrites it on the next pull; fix it in Crowdin.
          commit_message: 'chore(i18n): update translations from Crowdin'

          github_user_name: github-actions[bot]
          github_user_email: github-actions[bot]@users.noreply.github.com

          # Signing, configured on the action rather than on the host, because this action runs in
          # its own Docker container and the commit is made there. See the note above the checkout.
          #
          # KNOWN GAP — the signature is produced but GitHub does not verify it. The first real
          # run committed with `verification.verified: false`, `reason: unknown_key`, and that is
          # not a missing upload that can be fixed by adding a key somewhere: GitHub verifies a
          # signature by matching the key to an account holding that public key with a **verified
          # email matching the signature identity**, and the identity above is
          # `github-actions[bot]@users.noreply.github.com` — GitHub's own App, on which nobody can
          # register a GPG key. The author and the key belong to different parties, so no upload
          # makes this combination verify.
          #
          # Fixing it means choosing an identity that can own the key — a Nuxeo bot account with
          # the public key added and that email verified — and setting both fields to it. That is
          # account-level work and a decision about which account, so it is recorded rather than
          # guessed at here. Until then `GPG_BOT_SIGNING_ENABLED` buys a signature nobody checks,
          # and if `main` ever requires signed commits these pull requests will not merge.
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg_passphrase: ${{ secrets.GPG_PASSPHRASE }}
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          # A branch pushed with the default GITHUB_TOKEN does not start a workflow run, so the
          # translation pull request would arrive with no CI — and its own body promises the
          # catalogue gate has run on it. A bot PAT makes the push an event GitHub will act on.
          #
          # No `|| secrets.GITHUB_TOKEN` fallback. That fallback is what made the weaker outcome
          # the silent default: the job stayed green and delivered a pull request with no checks.
          # The preflight step requires this secret, so reaching here means it is set.
          #
          # `BOT_GITHUB_TOKEN` rather than a Crowdin-specific secret, because this repository
          # already had that one and a second copy of the same credential is a second thing to
          # rotate — and the one that goes stale is always the one nothing reads often.
          #
          # It has NEVER BEEN EXERCISED, though. Until this, `BOT_GITHUB_TOKEN` appeared only in
          # comments in `changelog.yml` and `release.yml`, offered as an option nobody took;
          # both use the default token. Its ability to push a branch and create a pull request is
          # therefore unverified; missing either permission makes the action fail. Separately, a
          # successful push made with the repository `GITHUB_TOKEN` would suppress follow-on
          # workflows and leave the pull request with no checks. Confirm on the first real run that
          # this token completes both operations and that checks start on the resulting pull request.
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
