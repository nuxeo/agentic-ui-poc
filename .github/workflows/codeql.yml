name: CodeQL Security Scanning

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 6:00 UTC to catch newly discovered vulnerabilities
    - cron: '0 6 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Least privilege permissions - CodeQL needs to upload results but not write code
permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@hylandsoftware'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.SATORI_GH_READONLY_TOKEN }}
          SATORI_GH_READONLY_TOKEN: ${{ secrets.SATORI_GH_READONLY_TOKEN }}

      # Initialize CodeQL tools for scanning
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Query suites: 'default' for standard checks, 'security-extended' for comprehensive security analysis
          queries: security-extended
          # Build mode: none for interpreted languages like JavaScript/TypeScript
          build-mode: none
          # Customize paths to scan (include monorepo structure)
          config: |
            paths:
              - apps
              - libs
            paths-ignore:
              - '**/node_modules'
              - '**/dist'
              - '**/coverage'
              - '**/*.spec.ts'
              - '**/*.test.ts'
              - '**/test/**'
              - '**/tests/**'

      # Autobuild is not needed for JavaScript/TypeScript as it's an interpreted language
      # CodeQL will analyze the source directly

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          # Upload results even if there are findings (don't fail the build on first run)
          upload: true
          # Optionally fail on error-level findings (uncomment after baseline is established)
          # wait-for-processing: true

      # Optional: Export SARIF for local review
      - name: Upload SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: ../results/*.sarif
          retention-days: 7
