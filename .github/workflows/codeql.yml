name: CodeQL

# SAST. Phase 6 step 4 of the Beta quality bar.
#
# Until now this repository had **no** static application security testing at all. Its security
# assurance was `npm audit` (dependencies, not our code) plus human review — and human review is
# what found all nine security defects fixed after the Phase 5 adversarial review: blob-URL
# lifecycles, missing subscription teardown, and an `<img [src]>` that bypassed the HTTP
# interceptor. Tooling found none of them, because there was no tooling.
#
# Two deliberate choices:
#
#   * `security-and-quality` rather than the default query suite. The default is tuned for low
#     noise on any repository; we would rather triage a false positive than miss a taint path in
#     an application that renders user-authored document content as HTML.
#   * A `schedule`, not just push. CodeQL's queries are updated independently of our code, so a
#     new query can find an old bug. A push-only run would never see it.
#
# Note on scope: CodeQL analyses OUR source. The `bypassSecurityTrustHtml` pairing that keeps the
# note-rendering paths safe is additionally enforced by `checkSanitizerPairing` in
# `scripts/review-guardrails.mjs`, because it is a repository-specific invariant that a generic
# query set is not going to express.

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 04:17 UTC. An odd minute so it is not competing with the top-of-hour rush.
    - cron: '17 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Required for CodeQL to upload results to the Security tab.
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # No build step. CodeQL's JavaScript/TypeScript analysis reads source directly, so the
      # 8-minute Angular build and the private-registry install it would need buy nothing here.
      # `npm ci` is deliberately skipped: it requires SATORI_GH_READONLY_TOKEN, and a SAST job
      # that cannot run without a secret is a SAST job that silently stops running on forks.

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
