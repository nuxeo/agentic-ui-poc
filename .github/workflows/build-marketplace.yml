name: Build Marketplace Package

on:
  # Build-only validation, so a PR that breaks the Maven package is caught before merge.
  # Never publishes — see the `if` on `push-to-preprod`.
  pull_request:
    branches:
      - main

  # The only lane that can publish, and the only lane that runs for `main`. There is
  # deliberately no `push` trigger: every merge to `main` used to build and publish a
  # timestamped package, which filled Marketplace preprod with builds nobody asked for.
  # Publishing is now always someone asking for it — here, or from `release.yml`, which
  # dispatches this workflow with publishToPreprod=true.
  workflow_dispatch:
    inputs:
      publishToPreprod:
        description: 'Publish the built package to Nuxeo Marketplace preprod'
        type: boolean
        default: false

concurrency:
  group: marketplace-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: >-
    -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
    -Daether.syncContext.named.time=600
    -Xms512m -Xmx1g

permissions:
  contents: read
  packages: read
  checks: write
  pull-requests: write

jobs:
  properties:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.env.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version info
        id: env
        run: |
          set -e
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | grep -v '\[' | head -n 1 | xargs)
          BASE_VERSION=${CURRENT_VERSION%-SNAPSHOT}

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION="${BASE_VERSION}-PR-${{ github.event.number }}-BUILD-${{ github.run_number }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            VERSION="${BASE_VERSION}-$(date +%Y%m%d%H%M%S)"
          else
            # Carries the branch in the version because these land in the same preprod list
            # as `main` builds, and a bare timestamp would make the two indistinguishable
            # once someone is looking at the Marketplace rather than at this workflow.
            # Drops the `feature/` or `fix/` prefix before truncating, otherwise the 24-char
            # cut lands mid-word and the version reads like a corrupted string.
            SLUG=$(echo "${{ github.ref_name }}" \
              | sed -E 's#^(feature|feat|fix|chore|docs)/##' \
              | tr -c '[:alnum:]' '-' | tr -s '-' | sed 's/^-//;s/-$//' | cut -c1-24 | sed 's/-$//')
            VERSION="${BASE_VERSION}-${SLUG}-$(date +%Y%m%d%H%M%S)"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: properties
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.properties.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@hylandsoftware'

      - name: Update Maven version
        run: mvn versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false

      - name: Update package.xml version
        run: |
          PACKAGE_XML="nuxeo-agentic-ui-package/src/main/resources/package.xml"
          sed -i "s/version=\"[^\"]*\"/version=\"$VERSION\"/" "$PACKAGE_XML"

      - name: Install npm dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.SATORI_GH_READONLY_TOKEN }}
          SATORI_GH_READONLY_TOKEN: ${{ secrets.SATORI_GH_READONLY_TOKEN }}

      - name: Build Angular application
        run: npx nx build nuxeo-ui --configuration=production --base-href=/nuxeo/agentic-ui/

      - name: Build Maven package
        run: |
          mvn clean package -pl nuxeo-agentic-ui-package -am -B -V -nsu --no-transfer-progress
          ls nuxeo-agentic-ui-package/target/*.zip

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuxeo-agentic-ui-package
          path: nuxeo-agentic-ui-package/target/*.zip
          retention-days: 30
          if-no-files-found: error

  push-to-preprod:
    needs: [properties, build]
    runs-on: ubuntu-latest
    # Nothing publishes on its own, `main` included: the branch only decides how the version
    # is stamped, never whether it ships. PR runs can never reach this job.
    # Compares against the string: `github.event.inputs` stringifies booleans, so
    # `== true` would never match, whether dispatched from the UI or `gh workflow run`.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publishToPreprod == 'true'
    env:
      VERSION: ${{ needs.properties.outputs.VERSION }}
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: nuxeo-agentic-ui-package
          path: packages

      - name: Publish to Nuxeo Marketplace (Preprod)
        uses: Alfresco/alfresco-build-tools/.github/actions/nuxeo/nos-publish@v12.10.3
        with:
          nos-env: staging
          nos-username: ${{ secrets.CONNECT_PREPROD_USERNAME }}
          nos-token: ${{ secrets.CONNECT_PREPROD_PASSWORD }}
          skip-verify: 'false'
          package-path: packages/nuxeo-agentic-ui-package-${{ env.VERSION }}.zip
