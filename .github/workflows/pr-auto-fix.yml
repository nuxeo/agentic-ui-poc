name: PR Review Summary

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

jobs:
  collect-review-comments:
    if: |
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '/fix-comments')) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'CHANGES_REQUESTED')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect all open review comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number || github.event.issue.number }}

          echo "## Open PR Review Comments — PR #${PR_NUMBER}" > /tmp/summary.md
          echo "" >> /tmp/summary.md
          echo "The following comments need to be addressed:" >> /tmp/summary.md
          echo "" >> /tmp/summary.md

          gh api repos/${{ github.repository }}/pulls/${PR_NUMBER}/comments \
            | jq -r '.[] | "### `\(.path)` line \(.line // "N/A")\n> \(.body)\n"' \
            >> /tmp/summary.md

          cat /tmp/summary.md

      - name: Post summary as PR comment with agent instructions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number || github.event.issue.number }}
          SUMMARY=$(cat /tmp/summary.md)

          gh pr comment ${PR_NUMBER} --body "## Agent Fix Ready

To fix all review comments automatically, open Cursor Agent and run:

\`\`\`
fix all PR review comments on PR #${PR_NUMBER}
\`\`\`

The agent will fetch these comments, implement fixes following project conventions
(AGENTS/08-bug-patterns.md, AGENTS/07-security.md), and push a follow-up commit.

---

${SUMMARY}"
