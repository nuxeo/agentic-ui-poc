# Pushes English to Crowdin and opens a pull request with whatever has been translated.
#
# Follows `nuxeo/nuxeo-web-ui` and `nuxeo/nuxeo-elements`, which run the same action on the
# same schedule, so there is one procedure to learn across the three repositories.
#
# ## What this does NOT do
#
# It does not merge anything. The translation pull request is reviewed like any other, which
# is the point: a pull request nobody owns is the documented failure mode of the Web UI
# process, and NXSAT-227 records "who owns the daily translation PR" as an open decision. This
# workflow makes the work visible; it does not decide who does it.
#
# ## Translator context is not carried by this file
#
# INFO-144 requires every string to reach a translator with context. Our context lives in
# `apps/nuxeo-ui/public/i18n/en.context.json`, keyed identically to the catalogue, and
# Crowdin's JSON format has nowhere to put it — JSON carries no comments. It is pushed
# separately by `tools/i18n/crowdin-push-context.mjs` in the step below, through the API.
#
# That script has never run against a real project, because the project does not exist yet
# (blocked on the INTERN board). It is written, reviewed and gated for shape; treat its first
# real run as unproven.
name: Crowdin Sync

on:
  # Every day, so a translation finished on Tuesday is not waiting for someone to remember.
  schedule:
    - cron: '0 0 * * *'

  # And immediately when the English source changes, so translators are never working from a
  # catalogue that has already moved.
  push:
    branches: ['main']
    paths:
      - 'apps/nuxeo-ui/public/i18n/en.json'
      - 'apps/nuxeo-ui/public/i18n/en.context.json'

  workflow_dispatch:

# Two runs pushing sources and opening the same pull request would race. The daily schedule and
# a push to main can easily coincide.
concurrency:
  group: crowdin-sync
  cancel-in-progress: false

jobs:
  crowdin:
    runs-on: ubuntu-latest
    # Absent without a configured project, and the action fails in a way that reads like a
    # broken workflow rather than an unfinished setup. Checked explicitly below instead.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      # Fail with a sentence rather than with the action's own credential error, which says
      # nothing about which of the three secrets is missing.
      - name: Check the Crowdin project is configured
        env:
          PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          missing=""
          [ -z "$PROJECT_ID" ] && missing="$missing CROWDIN_PROJECT_ID"
          [ -z "$TOKEN" ] && missing="$missing CROWDIN_PERSONAL_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "The Crowdin project is created manually through the INTERN board — see"
            echo "NXSAT-227 slice S6. Until it exists this workflow cannot run, and that is"
            echo "a setup step rather than a defect in this file."
            exit 1
          fi

      - name: Crowdin Action
        id: crowdin-sync
        uses: crowdin/github-action@8868a33591d21088edfc398968173a3b98d51706 # v2.16.2
        with:
          # The action's own `git checkout "${GITHUB_REF#refs/heads/}"` would undo the `ref`
          # above on a scheduled run.
          skip_ref_checkout: true

          project_id: ${{ secrets.CROWDIN_PROJECT_ID }}
          token: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          config: crowdin-conf.yml

          upload_sources: true
          # English is the reference. Leaving it unapproved makes every source string look like
          # outstanding work in the Crowdin dashboard.
          auto_approve_imported: true

          download_translations: true
          create_pull_request: true
          localization_branch_name: crowdin-translations-update
          pull_request_base_branch_name: main
          pull_request_title: 'chore(i18n): new Crowdin translations'
          pull_request_body: |
            Opened by the Crowdin Sync workflow. Contains only files under
            `apps/nuxeo-ui/public/i18n/`.

            Review it as a normal pull request. `checkTranslationCatalogues` runs on it and
            will fail a catalogue that is malformed, blank-valued or out of key parity with
            English, which is the failure mode a half-finished translation produces.

            Never hand-edit a non-English catalogue to fix something here — Crowdin is the
            source of truth and overwrites it on the next pull. Fix it in Crowdin.
          commit_message: 'chore(i18n): update translations from Crowdin'

          github_user_name: github-actions[bot]
          github_user_email: github-actions[bot]@users.noreply.github.com

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # After the sources are uploaded, and only then: context attaches to strings that exist.
      - name: Push translator context
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: node tools/i18n/crowdin-push-context.mjs
