name: Setup workspace
description: >-
  Installs Node and dependencies and resolves the Nx affected SHAs into NX_BASE / NX_HEAD.
  The caller must run actions/checkout with fetch-depth 0 first — a local composite action
  cannot be resolved before the repository exists on disk, and Nx affected needs full history.

inputs:
  satori-token:
    description: Read-only GitHub token used to authenticate against the private Satori npm registry.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci
      env:
        SATORI_GH_READONLY_TOKEN: ${{ inputs.satori-token }}

    - uses: nrwl/nx-set-shas@v4

    - name: Ensure affected SHAs are available
      shell: bash
      run: |
        set -euo pipefail
        git fetch --no-tags --prune origin

        if ! git cat-file -e "$NX_BASE^{commit}" 2>/dev/null; then
          git fetch --no-tags origin "$NX_BASE"
        fi

        if ! git cat-file -e "$NX_HEAD^{commit}" 2>/dev/null; then
          git fetch --no-tags origin "$NX_HEAD"
        fi
