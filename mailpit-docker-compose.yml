# Local SMTP capture for Nuxeo User.Invite and notification emails.
# See nuxeo-conf/README.md (Mail setup section).
#
# Start:
#   docker network create nuxeo-net   # once, if missing
#   docker network connect nuxeo-net nuxeo
#   docker compose -f mailpit-docker-compose.yml up -d
#
# Web UI: http://localhost:8025

services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - '8025:8025'
      - '1025:1025'
    networks:
      - nuxeo-net

networks:
  nuxeo-net:
    external: true
