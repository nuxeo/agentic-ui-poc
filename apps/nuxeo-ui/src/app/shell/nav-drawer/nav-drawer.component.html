@if (activeItem(); as item) {
  <div class="drawer-header">
    <h2 class="drawer-title">{{ item.label }}</h2>
  </div>

  <mat-nav-list class="drawer-list">
    <a mat-list-item (click)="itemSelected.emit(item.path)">
      <span class="placeholder-text">Go to {{ item.label }}</span>
    </a>
  </mat-nav-list>

  <div class="drawer-empty">
    <p>Content for "{{ item.label }}" will appear here.</p>
  </div>
}
