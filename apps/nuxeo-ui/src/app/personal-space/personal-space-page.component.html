<div class="personal-space-page">
  @if (loading()) {
    <div class="personal-space-page__loading">
      <mat-spinner
        diameter="40"
        [attr.aria-label]="'app.personal-space-page.loading' | translate"
      />
      <p>{{ 'app.personal-space-page.loading-your-personal-workspace' | translate }}</p>
    </div>
  } @else if (error()) {
    <div class="personal-space-page__error">
      <p>{{ error() }}</p>
      <button mat-stroked-button type="button" (click)="retry()">
        {{ 'app.personal-space-page.retry' | translate }}
      </button>
    </div>
  }
</div>
