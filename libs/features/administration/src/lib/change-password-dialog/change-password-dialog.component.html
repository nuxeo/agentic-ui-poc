<h2 mat-dialog-title>{{ 'admin.change-password-dialog.change-password' | translate }}</h2>
<mat-dialog-content class="pwd-form">
  <p class="pwd-hint">
    {{ 'admin.change-password-dialog.user' | translate }} <strong>{{ data.username }}</strong>
  </p>
  <mat-form-field appearance="outline" class="full">
    <mat-label>{{ 'admin.change-password-dialog.new-password' | translate }}</mat-label>
    <input
      matInput
      type="password"
      name="pw1"
      [(ngModel)]="password"
      required
      autocomplete="new-password"
    />
  </mat-form-field>
  <mat-form-field appearance="outline" class="full">
    <mat-label>{{ 'admin.change-password-dialog.confirm-password' | translate }}</mat-label>
    <input
      matInput
      type="password"
      name="pw2"
      [(ngModel)]="confirm"
      required
      autocomplete="new-password"
    />
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end" class="pwd-actions">
  <button type="button" mat-button mat-dialog-close>
    {{ 'admin.change-password-dialog.cancel' | translate }}
  </button>
  <button type="button" mat-flat-button color="primary" [disabled]="!canSave()" (click)="save()">
    {{ 'admin.change-password-dialog.save' | translate }}
  </button>
</mat-dialog-actions>
