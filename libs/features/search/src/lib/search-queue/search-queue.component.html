<div class="queue-list">
  <div class="queue-filters">
    @for (filter of activeFilters(); track filter.value) {
      <button
        mat-stroked-button
        type="button"
        class="quick-filter-btn"
        [class.active]="filter.selected"
        (click)="onQuickFilterClick(filter.value)"
      >
        {{ filter.label }}
      </button>
    }
  </div>

  @if (items().length === 0) {
    <div class="queue-empty">
      <mat-icon>search_off</mat-icon>
      <p>No search results</p>
    </div>
  } @else {
    @for (item of items(); track item.id) {
      <button
        type="button"
        class="queue-item"
        [class.active]="item.id === selectedItemId()"
        (click)="onItemClick(item)"
      >
        <div class="queue-item-preview">
          @if (thumbnailFor(item.id); as preview) {
            <img [src]="preview" [alt]="item.title" class="queue-item-image" />
          } @else {
            <mat-icon class="queue-item-icon">{{ item.icon || 'description' }}</mat-icon>
          }
        </div>
        <div class="queue-item-content">
          <h4 class="queue-item-title">{{ item.title }}</h4>
        </div>
      </button>
    }
  }
</div>
