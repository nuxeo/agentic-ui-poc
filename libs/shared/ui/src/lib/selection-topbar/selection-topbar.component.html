<div class="selection-topbar">
  <div class="topbar-left">
    <span class="selected-label">All {{ selectedCount() }} item(s) selected</span>
    <button mat-button type="button" class="clear-btn" (click)="openSelectionPopup()">
      Display selection
    </button>
    <button mat-button type="button" class="clear-btn" (click)="cleared.emit()">Clear</button>
  </div>

  <div class="topbar-actions">
    @for (action of bulkActions(); track action.id) {
      <button
        mat-icon-button
        type="button"
        class="topbar-icon-btn"
        [attr.data-action-id]="action.id"
        [matTooltip]="action.tooltip ?? action.label"
        matTooltipPosition="below"
        matTooltipClass="selection-topbar-tooltip mat-tooltip-multiline"
        [attr.aria-label]="action.label"
        [disabled]="!isEnabled(action)"
        (click)="run(action)"
      >
        <mat-icon>{{ action.icon }}</mat-icon>
      </button>
    }
  </div>
</div>

@if (selectionPopupOpen()) {
  <button
    type="button"
    class="selection-popup-backdrop"
    aria-label="Close selected items popup"
    (click)="closeSelectionPopup()"
  ></button>
  <div
    #selectionPopupPanel
    class="selection-popup"
    role="dialog"
    aria-modal="true"
    aria-labelledby="selection-popup-title"
    tabindex="-1"
  >
    <div class="selection-popup-header">
      <span id="selection-popup-title" class="selection-popup-title">Selected Items</span>
      <button
        mat-icon-button
        type="button"
        aria-label="Close"
        class="selection-popup-close"
        (click)="closeSelectionPopup()"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="selection-popup-body">
      @for (item of selectedItems(); track item.id) {
        <div class="selection-item">
          @if (item.preview) {
            <img class="selection-item-preview" [src]="item.preview" alt="" />
          } @else {
            <span class="selection-item-preview selection-item-preview--placeholder"></span>
          }
          <span class="selection-item-name">{{ item.name }}</span>
        </div>
      }
    </div>
  </div>
}
