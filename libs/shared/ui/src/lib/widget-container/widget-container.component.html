<div class="widget">
  <div class="widget-header">
    @if (icon()) {
      <mat-icon class="widget-header-icon" [style.color]="iconColor()">{{ icon() }}</mat-icon>
    }
    <div class="widget-header-title" role="heading" aria-level="3">{{ title() }}</div>
    <ng-content select="[widgetActions]" />
  </div>

  <div class="widget-body">
    <ng-content />
  </div>
</div>
