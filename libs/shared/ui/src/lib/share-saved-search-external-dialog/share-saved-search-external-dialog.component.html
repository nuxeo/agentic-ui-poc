<h2 mat-dialog-title>Share With External User</h2>

<mat-dialog-content>
  @if (isEditMode) {
    <div class="field-label">Email</div>
    <div class="readonly-value">{{ email }}</div>
  } @else {
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Email *</mat-label>
    <input matInput type="email" placeholder="name@company.com" [(ngModel)]="email" required />
  </mat-form-field>
  }

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Right</mat-label>
    <mat-select [(ngModel)]="right">
      @for (opt of rightOptions; track opt.value) {
        <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <div class="date-fields">
    <mat-form-field appearance="outline">
      <mat-label>From</mat-label>
      <input matInput [matDatepicker]="fromPicker" [(ngModel)]="beginDate" />
      <mat-datepicker-toggle matIconSuffix [for]="fromPicker" />
      <mat-datepicker #fromPicker />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>To *</mat-label>
      <input matInput [matDatepicker]="toPicker" [(ngModel)]="endDate" required />
      <mat-datepicker-toggle matIconSuffix [for]="toPicker" />
      <mat-datepicker #toPicker />
    </mat-form-field>
  </div>

  <div class="notify-section">
    <label class="field-label" for="notify">Notification email</label>
    <mat-form-field appearance="outline" class="full-width">
      <textarea
        id="notify"
        matInput
        rows="2"
        [(ngModel)]="notifyComment"
        placeholder="Hi! Could you comment on this document and..."
      ></textarea>
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
  <span class="spacer"></span>
  @if (!isEditMode) {
  <button mat-flat-button color="primary" [disabled]="!isValid() || saving()" (click)="create(true)">
    Create And Add Another
  </button>
  }
  <button mat-flat-button color="primary" [disabled]="!isValid() || saving()" (click)="create(false)">
    {{ isEditMode ? 'Update' : 'Create' }}
  </button>
</mat-dialog-actions>
