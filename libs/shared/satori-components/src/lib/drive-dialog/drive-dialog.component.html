<div class="nxs-drive-dialog__body">
  @if (checking()) {
    <div class="nxs-drive-dialog__checking" role="status">
      <nxs-spinner diameter="32" />
      <p class="nxs-drive-dialog__checking-text">{{ 'nxs.drive-dialog.checking' | translate }}</p>
    </div>
  } @else {
    <h2 mat-dialog-title class="nxs-drive-dialog__title">
      {{ 'nxs.drive-dialog.title' | translate }}
    </h2>
    <table class="nxs-drive-dialog__table">
      <thead>
        <tr>
          <th scope="col">{{ 'nxs.drive-dialog.platform' | translate }}</th>
          <th scope="col">{{ 'nxs.drive-dialog.package' | translate }}</th>
        </tr>
      </thead>
      <tbody>
        @for (pkg of packages; track pkg.platform) {
          <tr>
            <td>
              <span class="nxs-drive-dialog__platform">{{ pkg.platform }}</span>
            </td>
            <td>
              <a
                class="nxs-drive-dialog__package"
                [href]="pkg.url"
                target="_blank"
                rel="noopener"
                >{{ pkg.name }}</a
              >
            </td>
          </tr>
        }
      </tbody>
    </table>
    <button type="button" class="nxs-drive-dialog__close" (click)="close()">
      {{ 'nxs.drive-dialog.close' | translate }}
    </button>
  }
</div>
