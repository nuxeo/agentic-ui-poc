<div class="hxp-browse-nav-drawer">
  <div class="drawer-header">
    <div class="drawer-title" role="heading" aria-level="2">{{ title() }}</div>
    <button
      type="button"
      class="refresh-btn"
      [title]="'hxp.hxp-browse-nav-drawer.refresh' | translate"
      [attr.aria-label]="'hxp.hxp-browse-nav-drawer.refresh' | translate"
      (click)="refreshTree()"
    >
      <hxp-icon name="refresh" size="sm" [decorative]="true" />
    </button>
  </div>

  @if (showRootBack()) {
    <button class="tree-back" type="button" (click)="navigateToRoot()">
      <hxp-icon name="chevron-left" size="sm" [decorative]="true" />
      {{ 'nav.tree.root' | translate }}
    </button>
  }

  <!-- Upstream's tree owns its own loading, empty and expansion state, so the wrappers our
       hand-written tree needed are gone. It emits the selected Document rather than a path. -->
  <div class="folder-tree">
    <!-- Re-created when the key changes: upstream reads its root once and cannot reload. -->
    @for (key of [treeKey()]; track key) {
      <!-- `hxpDocumentTreeToggleName` is W15: upstream names the folder toggle after `node.name`,
           which its own node wrapper does not have, so every toggle was announced as
           `Toggleundefined`. The directive sets the name from the rendered row through
           `nav.tree.toggle`. -->
      <hxp-document-tree
        hxpDocumentTreeToggleName
        [rootDocument]="treeRoot()"
        [documents]="selected()"
        [multiSelection]="false"
        (selectedDocument)="onDocumentSelected($event)"
      />
    }
  </div>
</div>
