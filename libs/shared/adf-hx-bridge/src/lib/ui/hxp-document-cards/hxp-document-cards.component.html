<div class="hxp-card-grid">
  @for (doc of documents(); track doc.sys_id) {
    <div class="hxp-doc-card-wrapper" [class.hxp-doc-card-wrapper--selected]="isSelected(doc)">
      <div class="hxp-grid-card-checkbox">
        <input
          type="checkbox"
          [checked]="isSelected(doc)"
          [attr.aria-label]="selectionLabel(doc)"
          (click)="toggleSelection(doc, $event)"
        />
      </div>
      <button class="hxp-doc-card" type="button" (click)="documentClick.emit(doc)">
        <div class="hxp-card-thumb">
          @if (thumbnailUrl(doc); as thumb) {
            <img [src]="thumb" alt="" class="hxp-card-thumb-img" />
          } @else {
            <hxp-icon
              class="hxp-card-thumb-icon"
              [class.hxp-card-thumb-icon--folder]="isFolderish(doc)"
              [name]="docIcon(doc)"
              size="lg"
              [decorative]="true"
            />
          }
        </div>
        <div class="hxp-card-body">
          <span class="hxp-card-title">{{ docTitle(doc) }}</span>
          <span class="hxp-card-type">{{ docTypeLabel(doc) }}</span>
        </div>
      </button>
    </div>
  }
</div>
