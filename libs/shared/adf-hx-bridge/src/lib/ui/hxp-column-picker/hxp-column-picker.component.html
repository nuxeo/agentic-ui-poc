<button
  type="button"
  class="hxp-col-panel-backdrop"
  [attr.aria-label]="'hxp.hxp-column-picker.close-column-picker' | translate"
  (click)="dismiss.emit()"
></button>
<div
  #panel
  class="hxp-col-panel"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="'hxp.hxp-column-picker.column-settings' | translate"
  tabindex="-1"
>
  <p class="hxp-col-panel-title">{{ 'hxp.hxp-column-picker.column-settings' | translate }}</p>
  <div class="hxp-col-panel-list">
    @for (col of columns(); track col.key) {
      <label class="hxp-col-panel-option">
        <input
          type="checkbox"
          [checked]="isChosen(col.key)"
          [disabled]="isRequired(col.key)"
          (change)="toggle(col.key)"
        />
        {{ col.labelKey ? (col.labelKey | translate) : col.label }}
      </label>
    }
  </div>
  <div class="hxp-col-panel-actions">
    <button type="button" class="hxp-col-panel-btn" (click)="reset()">
      {{ 'hxp.hxp-column-picker.reset' | translate }}
    </button>
    <button type="button" class="hxp-col-panel-btn hxp-col-panel-btn--primary" (click)="commit()">
      {{ 'hxp.hxp-column-picker.done' | translate }}
    </button>
  </div>
</div>
