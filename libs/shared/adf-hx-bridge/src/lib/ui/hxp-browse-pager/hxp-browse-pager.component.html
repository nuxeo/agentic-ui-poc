<nav class="hxp-pager" [attr.aria-label]="'hxp.hxp-browse-pager.document-list-pages' | translate">
  <span class="hxp-pager__range" role="status">{{ rangeLabel() }}</span>
  <button
    type="button"
    class="hxp-pager__btn"
    [attr.aria-label]="'hxp.hxp-browse-pager.previous-page' | translate"
    [disabled]="!canPrevious()"
    (click)="previous()"
  >
    {{ 'hxp.hxp-browse-pager.previous' | translate }}
  </button>
  <button
    type="button"
    class="hxp-pager__btn"
    [attr.aria-label]="'hxp.hxp-browse-pager.next-page' | translate"
    [disabled]="!canNext()"
    (click)="next()"
  >
    {{ 'hxp.hxp-browse-pager.next' | translate }}
  </button>
</nav>
