<div class="tree-list">
  @for (node of tree.displayNodes(); track node.doc.sys_id) {
    <ng-container *ngTemplateOutlet="folderTpl; context: { $implicit: node, depth: 0 }" />
  }
</div>

<ng-template #folderTpl let-node let-depth="depth">
  <div class="tree-node" [style.padding-left.px]="12 + depth * 20">
    @if (hasChildren(node)) {
      <button class="tree-toggle" (click)="toggleNode(node)" type="button">
        @if (node.loading) {
          <hxp-spinner [size]="14" />
        } @else {
          <hxp-icon
            name="chevron-right"
            size="sm"
            class="tree-arrow"
            [class.tree-arrow--expanded]="node.expanded"
          />
        }
      </button>
    } @else {
      <span class="tree-toggle-spacer"></span>
    }

    <button
      class="tree-label"
      [class.tree-label--active]="isNodeActive(node)"
      (click)="navigateToFolder(node)"
      type="button"
    >
      {{ nodeLabel(node) }}
    </button>
  </div>

  @if (node.expanded && node.children.length > 0) {
    @for (child of node.children; track child.doc.sys_id) {
      <ng-container
        *ngTemplateOutlet="folderTpl; context: { $implicit: child, depth: depth + 1 }"
      />
    }
  }
</ng-template>
