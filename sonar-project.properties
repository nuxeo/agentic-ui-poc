# Organization and project keys
# NOTE: These should be provided via environment variables or GitHub Actions workflow
# sonar.organization=<set-via-SONAR_ORGANIZATION-secret>
# sonar.projectKey=<set-via-SONAR_PROJECT_KEY-secret>

sonar.projectName=Nuxeo Agentic UI
sonar.projectVersion=1.0

# Repository structure (Nx monorepo)
sonar.sources=apps,libs
sonar.tests=apps,libs

# Include only source files
sonar.inclusions=**/*.ts,**/*.html,**/*.scss,**/*.css,**/*.js

# Exclude patterns
# - Build artifacts and dependencies
# - Test files (marked separately via test.inclusions)
# - Configuration and tooling
# - Generated files
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.config.ts,\
  **/*.config.js,\
  **/tools/**,\
  **/scripts/**,\
  **/e2e/**,\
  **/.nx/**,\
  **/tmp/**,\
  **/*.d.ts,\
  **/*.mock.ts,\
  **/stubs/**,\
  **/test-setup.ts

# Test file patterns
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# TypeScript/JavaScript specific settings
sonar.typescript.lcov.reportPaths=coverage/**/lcov.info
sonar.javascript.lcov.reportPaths=coverage/**/lcov.info

# Coverage exclusions (files that don't need coverage tracking)
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.mock.ts,\
  **/*.config.ts,\
  **/*.config.js,\
  **/e2e/**,\
  **/tools/**,\
  **/scripts/**,\
  **/*.module.ts,\
  **/main.ts,\
  **/polyfills.ts,\
  **/environments/**,\
  **/test-setup.ts,\
  **/stubs/**

# Duplication detection - exclude test files
sonar.cpd.exclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.mock.ts

# Encoding and SCM
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Additional settings for better Angular/TypeScript analysis
sonar.typescript.node=20
sonar.exclusions.angular=**/node_modules/**

# Pull request decoration
sonar.pullrequest.provider=github

# Branch analysis (for feature branches)
sonar.branch.name=${BRANCH_NAME}

# Links
sonar.links.homepage=https://github.com/your-org/agentic-ui-poc
sonar.links.ci=https://github.com/your-org/agentic-ui-poc/actions
sonar.links.issue=https://github.com/your-org/agentic-ui-poc/issues
