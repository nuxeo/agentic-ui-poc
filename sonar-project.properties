# Organization and project keys
sonar.organization=nuxeo
sonar.projectKey=nuxeo_agentic-ui-poc
sonar.projectName=Nuxeo Agentic UI
sonar.projectVersion=1.0

# Repository structure (Nx monorepo)
sonar.sources=apps,libs
sonar.tests=apps,libs

# Include only source files
sonar.inclusions=**/*.ts,**/*.html,**/*.scss,**/*.css,**/*.js

# Exclude patterns
# - Build artifacts and dependencies
# - Test files (marked separately via test.inclusions)
# - Configuration and tooling
# - Generated files
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.config.ts,\
  **/*.config.js,\
  **/tools/**,\
  **/scripts/**,\
  **/e2e/**,\
  **/.nx/**,\
  **/tmp/**,\
  **/*.d.ts,\
  **/*.mock.ts,\
  **/stubs/**,\
  **/test-setup.ts

# Test file patterns
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Coverage. ONE explicit path, written by `scripts/lcov-merge.mjs`, not a glob over the
# per-project reports.
#
# The previous value was `coverage/**/lcov.info` and reported 0.0% coverage against a 90%
# threshold, for two compounding reasons:
#
#   1. No `lcov.info` existed at all. The Vitest v8 defaults are text/html/clover/json, and
#      neither `--coverageReporters=lcov` nor `--coverage.reporter=lcov` is passed through by
#      the Nx executor — the flag was accepted and silently ignored. Each project's
#      vite.config.mts now lists `lcov` in `test.coverage.reporter` explicitly.
#   2. Even once written, each project's records are relative to its own Vitest root
#      (`SF:src/lib/thing.ts`), which does not resolve from the repository root that Sonar
#      analyses from. Coverage for an unresolvable path is dropped silently, not reported.
#
# `lcov-merge.mjs` rebases the records onto the repository root, merges them, and fails if any
# path does not exist — so a broken report is a red build rather than a silent 0%.
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage exclusions (files that don't need coverage tracking)
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.mock.ts,\
  **/*.config.ts,\
  **/*.config.js,\
  **/e2e/**,\
  **/tools/**,\
  **/scripts/**,\
  **/*.module.ts,\
  **/main.ts,\
  **/polyfills.ts,\
  **/environments/**,\
  **/test-setup.ts,\
  **/stubs/**

# Duplication detection - exclude test files
sonar.cpd.exclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.mock.ts

# Encoding and SCM
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Additional settings for better Angular/TypeScript analysis
sonar.typescript.node=20
sonar.exclusions.angular=**/node_modules/**

# Branch and pull-request analysis are deliberately NOT configured here. The scanner does
# not expand `${VAR}` in this file, so a `sonar.branch.name=${BRANCH_NAME}` line sets the
# literal string rather than the branch and breaks branch analysis. The GitHub Action
# already infers branch and PR context from the runner environment; pass
# -Dsonar.branch.name from the workflow if that inference ever needs overriding.

# Links
sonar.links.homepage=https://github.com/nuxeo/agentic-ui-poc
sonar.links.ci=https://github.com/nuxeo/agentic-ui-poc/actions
sonar.links.issue=https://github.com/nuxeo/agentic-ui-poc/issues
