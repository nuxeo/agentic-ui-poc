# Crowdin source and translation mapping.
#
# Implements D8 in `docs/i18n-localization-plan.md`, which is the plan of record for this
# ticket. The first version of this file was built from `nuxeo/nuxeo-web-ui` alone and missed
# four things D8 already specified — the enterprise endpoint, approval gating, the source-change
# policy and obsolete-key deletion. The reference repositories are the procedure; this file is
# the contract.
#
# Named `crowdin-conf.yml` rather than `crowdin.yml` to match `nuxeo-web-ui` and
# `nuxeo-elements`. The action picks a root `crowdin.yml` up implicitly; naming it otherwise
# forces the workflows to pass `config:` explicitly, which keeps the file in use visible.

# Hyland Crowdin Enterprise, NOT public crowdin.com. The project lives on the Hyland tenant,
# and a token issued there does not authenticate against the public API — the failure is a
# 401 that reads like a bad secret rather than a wrong host.
'base_url': 'https://hyland.api.crowdin.com'

'project_id_env': 'CROWDIN_PROJECT_ID'
'api_token_env': 'CROWDIN_PERSONAL_TOKEN'

'base_path': '.'
'preserve_hierarchy': true

# ## The trap in the glob
#
# The HXP standard's example is `/**/**/i18n/en.json`. Do not copy it. With `base_path: "."` it
# sweeps `node_modules`, which holds 48 upstream catalogues — adf-core's 19 locales, both
# adf-hx bundles, satori-ui's 15. That pushes Alfresco's and Satori's strings into our project
# and bills the translation crew for work another team has already paid for.
#
# Scoped to `apps/` and `libs/`, as D8 requires. `node_modules` sits beside both, so neither
# pattern can reach it. `checkCrowdinConfig` in `scripts/review-guardrails.mjs` fails any
# source path that does not begin with one of those two roots.
#
# There is NO `libs/**` entry, and that is the correction to an earlier mistake rather than an
# oversight.
#
# One was added ahead of NXSAT-284 AC4 (per-library catalogues) on the reasoning that shipping
# one later should be an asset glob rather than a change to this contract. That reasoning was
# wrong, because Crowdin treats a source pattern matching NOTHING as an error:
#
#     File 'apps/nuxeo-ui/public/i18n/en.json'
#     No sources found for '/libs/**/i18n/en.json' pattern.
#     Current execution finished with errors
#
# The English catalogue had already uploaded by then. The job still failed, and because it
# failed the translator-context step was skipped — so a forward-looking glob cost us the
# context upload, which INFO-144 requires.
#
# `--dryrun` does not report it either: the dry run printed only the file it would upload and
# said nothing about the unmatched pattern. That is a CLI limitation and it still stands.
#
# What no longer stands is the conclusion. `checkCrowdinConfig` now fails each unmatched
# pattern by name, so this is caught in CI before any push — which is the only reason the
# limitation is survivable.
#
# Add the entry in the same change that ships the first library catalogue, not before.
'files': [
    {
      'source': '/apps/*/public/i18n/en.json',
      # `%two_letters_code%`, NOT D8's `%locale%`. Crowdin's `%locale%` renders French as
      # `fr-FR`, and `AppTranslateLoader` fetches `i18n/fr.json` using the two-letter language
      # ngx-translate was given — so `%locale%` downloads files the application never reads
      # while the sync still reports success. Deviation recorded as D8a in the plan.
      'translation': '/%original_path%/%two_letters_code%.%file_extension%',
      # Unapproved work is someone's draft. Exporting it puts half-finished translations in
      # front of users and makes the reviewer's approval meaningless.
      'export_only_approved': 'true',
      # The standard's choice, and it carries an assumption we inherit: a developer must NEVER
      # change the meaning of an existing key — change the key instead. Nothing enforces that,
      # which is why it is in the maintenance checklist and recorded as deviation D0a.
      'update_option': 'update_without_changes',
    },
  ]
