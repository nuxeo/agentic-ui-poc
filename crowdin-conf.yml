# Crowdin source and translation mapping.
#
# Implements D8 in `docs/i18n-localization-plan.md`, which is the plan of record for this
# ticket. **The authority is the Hyland Crowdin standard** — "Guidelines for Localization
# Management with Crowdin Translations Tool" (HXP, ACCEPTED, RFC 2119) and its Technical Usage
# Guide. `D8-standard` in the plan is the conformance record, clause by clause.
#
# `nuxeo/nuxeo-web-ui` is NOT the reference. It is an older implementation on the public tenant
# and is not compliant with the Guidelines; where the two differ, the standard wins. The first
# version of this file was built from web-ui alone and missed four things the standard specifies —
# the enterprise endpoint, approval gating, the source-change policy and obsolete-key deletion.
# Web-ui is still worth measuring, and this file cites it that way where the numbers are
# instructive, but never as justification.
#
# At the repository root, which the standard requires. Named `crowdin-conf.yml` rather than
# `crowdin.yml`, which the standard does not mandate either way — our own choice, because the
# action picks a root `crowdin.yml` up implicitly, and naming it otherwise forces the workflows
# to pass `config:` explicitly and keeps the file in use visible.

# Hyland Crowdin Enterprise, NOT public crowdin.com. The project lives on the Hyland tenant,
# and a token issued there does not authenticate against the public API — the failure is a
# 401 that reads like a bad secret rather than a wrong host.
'base_url': 'https://hyland.api.crowdin.com'

'project_id_env': 'CROWDIN_PROJECT_ID'
'api_token_env': 'CROWDIN_PERSONAL_TOKEN'

'base_path': '.'
'preserve_hierarchy': true

# ## The trap in the glob
#
# The HXP standard's example is `/**/**/i18n/en.json`. Do not copy it. With `base_path: "."` it
# sweeps `node_modules`, which holds 48 upstream catalogues — adf-core's 19 locales, both
# adf-hx bundles, satori-ui's 15. That pushes Alfresco's and Satori's strings into our project
# and bills the translation crew for work another team has already paid for.
#
# Scoped to `apps/` and `libs/`, as D8 requires. `node_modules` sits beside both, so neither
# pattern can reach it. `checkCrowdinConfig` in `scripts/review-guardrails.mjs` fails any
# source path that does not begin with one of those two roots.
#
# There is NO `libs/**` entry, and that is the correction to an earlier mistake rather than an
# oversight.
#
# One was added ahead of NXSAT-284 AC4 (per-library catalogues) on the reasoning that shipping
# one later should be an asset glob rather than a change to this contract. That reasoning was
# wrong, because Crowdin treats a source pattern matching NOTHING as an error:
#
#     File 'apps/nuxeo-ui/public/i18n/en.json'
#     No sources found for '/libs/**/i18n/en.json' pattern.
#     Current execution finished with errors
#
# The English catalogue had already uploaded by then. The job still failed, and because it
# failed the translator-context step was skipped — so a forward-looking glob cost us the
# context upload, which INFO-144 requires.
#
# `--dryrun` does not report it either: the dry run printed only the file it would upload and
# said nothing about the unmatched pattern. That is a CLI limitation and it still stands.
#
# What no longer stands is the conclusion. `checkCrowdinConfig` now fails each unmatched
# pattern by name, so this is caught in CI before any push — which is the only reason the
# limitation is survivable.
#
# Add the entry in the same change that ships the first library catalogue, not before.
'files': [
    {
      'source': '/apps/*/public/i18n/en.json',
      # `%two_letters_code%`, NOT D8's `%locale%`. Crowdin's `%locale%` renders French as
      # `fr-FR`, and `AppTranslateLoader` fetches `i18n/fr.json` using the two-letter language
      # ngx-translate was given — so `%locale%` downloads files the application never reads
      # while the sync still reports success. Deviation recorded as D8a in the plan.
      'translation': '/%original_path%/%two_letters_code%.%file_extension%',
      # Required by the standard, in MUST language: "When pulling translations from Crowdin, and
      # when proof-reading is setup, export options MUST be configured so that only approved
      # translations end up in the source code." — "Guidelines for Localization Management with
      # Crowdin Translations Tool" (HXP, ACCEPTED).
      #
      # Stated explicitly rather than left to the tool default, because this value was briefly
      # `false` and the record of that round trip is worth more than a clean-looking line. The
      # argument for `false` was mechanical and correct as far as it went: machine pre-translation
      # cannot approve what it adds — the CLI's `--auto-approve-option` covers TM pre-translation
      # only and our translation memory is empty — so with `true` a pre-translated project would
      # fill up and export NOTHING while every dashboard reported the work as done.
      #
      # Two things make that the wrong conclusion. Enrico Stengert confirmed on INTERN-1346,
      # 28 September 2026, that the sources are visible in Crowdin and "translations can begin on
      # our end" — which disposes of the premise that approval can never arrive. It is NOT evidence
      # that a proof-reading step is configured on the project, and the MUST is conditional on
      # proof-reading being "setup", so confirming that is an open owner action in `D8-standard`.
      #
      # The second reason does not depend on the condition at all. The Guidelines' security risk
      # table marks "Reputation Damage (insertion of controversial or profane content through
      # translations)" RESOLVED, on the grounds that "nothing is crowdsourced by random people and
      # every content is reviewed internally". Exporting unreviewed machine output ships content no
      # linguist has seen, which removes the thing that row is resting on.
      #
      # So `true` is right either way: if proof-reading is set up the MUST binds, and if it is not,
      # the MUST is dormant while the risk argument still holds. Being wrong in this direction
      # costs an empty export, which is visible; being wrong in the other ships unreviewed wording.
      #
      # So `true` stands, and machine pre-translation is the Translation Team's call rather than
      # ours — the Guidelines leave workflow choice to them. Recorded as D8g.
      'export_only_approved': 'true',
      # The standard's choice, and it carries an assumption we inherit: a developer must NEVER
      # change the meaning of an existing key — change the key instead. Nothing enforces that,
      # which is why it is in the maintenance checklist and recorded as deviation D0a.
      'update_option': 'update_without_changes',
    },
  ]
